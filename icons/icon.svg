<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background: warm cream radial, brighter at top-center -->
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2EEE8"/>
      <stop offset="100%" stop-color="#DDD4C6"/>
    </radialGradient>

    <!-- Halo: solid coral red, used as subtle warm tint -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B83A2E"/>
      <stop offset="60%" stop-color="#B83A2E"/>
      <stop offset="100%" stop-color="#B83A2E"/>
    </radialGradient>

    <!-- Orb fill: peach-rose (top-right) to periwinkle (bottom-left) -->
    <linearGradient id="duo" x1="713.5" y1="310.5" x2="310.5" y2="713.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9A88"/>
      <stop offset="100%" stop-color="#8A9EFF"/>
    </linearGradient>

    <!-- Ring strokes: crimson (top-right) to deep indigo (bottom-left) -->
    <linearGradient id="duo-deep" x1="856.2" y1="372.6" x2="372.6" y2="856.2" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B83A2E"/>
      <stop offset="100%" stop-color="#2A3A98"/>
    </linearGradient>

    <!-- Orb 3D form: white highlight top-center, black below -->
    <radialGradient id="form" cx="47%" cy="32%" r="52%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

