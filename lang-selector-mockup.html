<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Langue · Mockup v4</title>
<style>
:root {
  --ink:  #f0ece0;
  --soft: rgba(240,236,224,0.42);
  --serif: Georgia,'Times New Roman',serif;
  --mono: 'Courier New',Courier,monospace;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }

/* ── Background: subtle diagonal texture gives glass something to refract ── */
body {
  /* Same atmosphere as the conversation screen */
  background:
    radial-gradient(140% 100% at 50% 0%,
      hsla(220,65%,62%,0.10) 0%,
      hsla(220,60%,50%,0.05) 45%,
      #0d0f1a 100%),
    radial-gradient(140% 100% at 50% 0%,
      #2a2e48 0%, #181b2d 45%, #0d0f1a 100%),
    repeating-linear-gradient(
      -45deg,
      rgba(255,255,255,0.010) 0px, rgba(255,255,255,0.010) 1px,
      transparent 1px, transparent 9px
    );
  display:flex; align-items:center; justify-content:center;
  font-family: var(--serif);
  user-select: none;
}

.screen {
  width:390px; height:100vh;
  display:flex; flex-direction:column; align-items:center;
  justify-content: center; gap: 20px;
  position: relative;
}

/* ── Carousel ── */
.carousel-wrap {
  width: 100%; height: 140px;
  position: relative; flex-shrink: 0;
  cursor: grab;
  overflow: visible;
}
.carousel-wrap:active { cursor: grabbing; }
.carousel-track { position: absolute; inset: 0; overflow: visible; }

.slide {
  position: absolute; top: 50%; left: 50%;
  transform: translate(calc(-50% + var(--tx,0px)), -50%) scale(var(--sc,1));
  opacity: var(--op,1);
  transition: transform 0.4s cubic-bezier(0.35,1.1,0.65,1), opacity 0.32s ease;
  will-change: transform, opacity;
  cursor: pointer;
}

/* ── Liquid glass sphere ── */
.ob-sphere {
  width: 110px; height: 110px;
  border-radius: 50%; position: relative;
  filter:
    drop-shadow(0 0 16px rgba(180,210,255,0.55))
    drop-shadow(0 0  5px rgba(255,255,255,0.45));
}
/* Iridescent metallic ring at the glass edge */
.ob-sphere::after {
  content: '';
  position: absolute; inset: 0; border-radius: 50%;
  /* Prismatic arc: 10 o'clock → top → 2 o'clock — one bright side only */
  background: conic-gradient(from 300deg at 50% 50%,
    transparent                   0deg,
    rgba(0,230,255,0.70)         15deg,
    rgba(160,0,255,0.58)         45deg,
    rgba(255,160,0,0.55)         75deg,
    rgba(0,255,190,0.60)        100deg,
    transparent                 140deg,
    transparent                 360deg
  );
  -webkit-mask: radial-gradient(circle,
    transparent 59%, rgba(0,0,0,1) 65%, transparent 81%);
  mask: radial-gradient(circle,
    transparent 59%, rgba(0,0,0,1) 65%, transparent 81%);
  pointer-events: none;
}
.ob-glass-face {
  position: absolute; inset: 0; border-radius: 50%;
  backdrop-filter: blur(3px) brightness(1.28) saturate(1.6) contrast(0.90);
  -webkit-backdrop-filter: blur(3px) brightness(1.28) saturate(1.6) contrast(0.90);
  background: rgba(255,255,255,0.08);
}
.ob-svg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border-radius: 50%; overflow: hidden;
}
.ob-rim {
  position: absolute; inset: 0; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.58);
  box-shadow:
    inset 0  0  0  1.5px rgba(255,255,255,0.32),
    inset 0  2px 4px  rgba(255,255,255,0.72),
    inset 0 -4px 10px rgba(0,0,0,0.20),
    0 2px 22px rgba(0,0,0,0.20),
    0 0 0 0.5px rgba(255,255,255,0.30);
  pointer-events: none;
}

/* Ripple rings on selection */
@keyframes rippleExpand {
  0%   { transform: translate(-50%,-50%) scale(1);   opacity: 0.65; }
  100% { transform: translate(-50%,-50%) scale(2.8); opacity: 0;    }
}
.ob-ripple {
  position: absolute; top: 50%; left: 50%;
  width: 110px; height: 110px;
  transform: translate(-50%,-50%);
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.55);
  pointer-events: none;
  animation: rippleExpand 1.0s ease-out forwards;
}

/* ── Entry animations ── */
@keyframes obEntryUp {
  from { opacity: 0; transform: translateY(32px); }
  to   { opacity: 1; transform: translateY(0);    }
}
@keyframes obEntryFade {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.carousel-wrap { animation: obEntryUp   1.1s cubic-bezier(0.22,1,0.36,1) 0.10s both; }
.lang-name     { animation: obEntryFade 0.8s ease 0.55s both; }
.dots          { animation: obEntryFade 0.7s ease 0.85s both; }

/* ── Language name ── */
.lang-name {
  font-family: var(--serif); font-size: 1.55rem;
  color: var(--ink); text-align: center; flex-shrink: 0;
}

/* ── Dots ── */
.dots { display: flex; gap: 7px; flex-shrink: 0; }
.dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(240,236,224,0.25);
  transition: background 0.3s, transform 0.3s;
}
.dot.on { background: rgba(240,236,224,0.85); transform: scale(1.4); }
</style>
</head>
<body>
<div class="screen">
  <div class="carousel-wrap" id="carousel">
    <div class="carousel-track" id="track"></div>
  </div>
  <div class="lang-name" id="lang-name"></div>
  <div class="dots" id="dots"></div>
</div>

<script>
/*
  Phase → white specular position (viewBox 110×110, sphere center 55,55)
  cx = lit-side X position; narrower rx = thinner crescent

  es  full            → cx=55  wide
  en  waning-gibbous  → cx=37  left
  pt  waxing-gibbous  → cx=73  right
  fr  last-quarter    → cx=27  narrow left
  ar  first-quarter   → cx=83  narrow right
  zh  waning-crescent → cx=17  sliver left
  ru  waxing-crescent → cx=93  sliver right
  ja  new-moon        → ghost
*/
const LANGS = [
  { id:'es', name:'Español',   spec:{cx:55, cy:21, rx:28, ry:17} },
  { id:'en', name:'English',   spec:{cx:37, cy:21, rx:22, ry:15} },
  { id:'pt', name:'Português', spec:{cx:73, cy:21, rx:22, ry:15} },
  { id:'fr', name:'Français',  spec:{cx:27, cy:21, rx:16, ry:12} },
  { id:'ar', name:'العربية',   spec:{cx:83, cy:21, rx:16, ry:12} },
  { id:'zh', name:'中文',      spec:{cx:17, cy:21, rx: 9, ry: 7} },
  { id:'ru', name:'Русский',   spec:{cx:93, cy:21, rx: 9, ry: 7} },
  { id:'ja', name:'日本語',    spec:null                           },
];

const N = LANGS.length;
let cur = 0;

const TX = [0, 100, 172, 248, 320];
const SC = [1, 0.65, 0.42, 0.28, 0.20];
const OP = [1, 0.72, 0.48, 0.25, 0.10];

function buildSphere(lang) {
  const { id, spec } = lang;
  const C=55, R=52;

  const specHtml = spec ? `
    <ellipse cx="${spec.cx}" cy="${spec.cy}" rx="${spec.rx}" ry="${spec.ry}"
             fill="white" opacity="0.38" filter="url(#bs-${id})"/>
    <ellipse cx="${spec.cx-1}" cy="${spec.cy-2}"
             rx="${Math.round(spec.rx*.42)}" ry="${Math.round(spec.ry*.46)}"
             fill="white" opacity="0.58" filter="url(#bs2-${id})"/>` :
    `<ellipse cx="${C}" cy="21" rx="22" ry="13"
             fill="white" opacity="0.05" filter="url(#bs-${id})"/>`;

  return `
<div class="ob-sphere">
  <div class="ob-glass-face"></div>
  <svg class="ob-svg" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="dk-${id}" cx="50%" cy="80%" r="42%">
        <stop offset="0%"  stop-color="black" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
      </radialGradient>
      <filter id="bs-${id}"><feGaussianBlur stdDeviation="5"/></filter>
      <filter id="bs2-${id}"><feGaussianBlur stdDeviation="1.8"/></filter>
      <clipPath id="cl-${id}"><circle cx="${C}" cy="${C}" r="${R}"/></clipPath>
    </defs>
    <g clip-path="url(#cl-${id})">${specHtml}</g>
    <circle cx="${C}" cy="${C}" r="${R}" fill="url(#dk-${id})" clip-path="url(#cl-${id})"/>
  </svg>
  <div class="ob-rim"></div>
</div>`;
}

// Build slides
const track = document.getElementById('track');
LANGS.forEach((lang, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide';
  slide.dataset.i = i;
  slide.innerHTML = buildSphere(lang);
  track.appendChild(slide);
});

// Build dots
const dotsEl = document.getElementById('dots');
LANGS.forEach(_ => {
  const d = document.createElement('div');
  d.className = 'dot';
  dotsEl.appendChild(d);
});

function update(animated=true) {
  const slides = track.children;
  const dots   = dotsEl.children;
  document.getElementById('lang-name').textContent = LANGS[cur].name;
  [...dots].forEach((d,i) => d.classList.toggle('on', i===cur));
  [...slides].forEach((s,i) => {
    const raw    = ((i - cur) % N + N) % N;
    const adj    = raw > N/2 ? raw - N : raw;
    const absAdj = Math.abs(adj);
    const tx  = (adj<0?-1:1) * (TX[absAdj] ?? 400);
    const sc  = SC[absAdj] ?? 0.15;
    const op  = OP[absAdj] ?? 0;
    if (!animated) {
      s.style.transition = 'none';
      requestAnimationFrame(() => { s.style.transition = ''; });
    }
    s.style.setProperty('--tx', tx+'px');
    s.style.setProperty('--sc', sc);
    s.style.setProperty('--op', op);
    s.style.visibility = absAdj <= 2 ? 'visible' : 'hidden';
    s.style.zIndex = 10 - absAdj;
  });
}

// ── Swipe / drag ──
let x0=null, moved=false;
const carousel = document.getElementById('carousel');
function onStart(x) { x0=x; moved=false; }
function onMove(x)  { if(x0!==null && Math.abs(x-x0)>8) moved=true; }
function onEnd(x) {
  if(x0===null) return;
  const dx = x - x0;
  if(Math.abs(dx) > 44) { cur = dx<0 ? (cur+1)%N : (cur-1+N)%N; update(); }
  x0=null;
}
carousel.addEventListener('touchstart', e=>onStart(e.touches[0].clientX),{passive:true});
carousel.addEventListener('touchmove',  e=>onMove(e.touches[0].clientX), {passive:true});
carousel.addEventListener('touchend',   e=>onEnd(e.changedTouches[0].clientX));
carousel.addEventListener('mousedown',  e=>onStart(e.clientX));
window.addEventListener('mousemove', e=>{ if(!x0) return; onMove(e.clientX); });
window.addEventListener('mouseup',   e=>onEnd(e.clientX));

// Click: side → navigate, centre → ripple demo
track.addEventListener('click', e => {
  if(moved) return;
  const s = e.target.closest('.slide');
  if(!s) return;
  const i = parseInt(s.dataset.i);
  if(i !== cur) { cur=i; update(); return; }
  // Ripple demo
  for(let r=0; r<3; r++) {
    const ring = document.createElement('div');
    ring.className = 'ob-ripple';
    ring.style.animationDelay = `${r*190}ms`;
    s.appendChild(ring);
    setTimeout(()=>ring.remove(), 1600);
  }
});

// Keyboard
window.addEventListener('keydown', e => {
  if(e.key==='ArrowRight') { cur=(cur+1)%N; update(); }
  if(e.key==='ArrowLeft')  { cur=(cur-1+N)%N; update(); }
});

update(false);
</script>
</body>
</html>
