name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-android-${{ runner.os }}-

      - name: Restore keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > lun-ai-keystore.p12

      - name: Download icons
        run: |
          curl -fsSL -o /tmp/icon512.png https://lun-ai.vercel.app/icons/icon-512.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp /tmp/icon512.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done

      - name: Build AAB
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/lun-ai-keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: lun-ai-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
