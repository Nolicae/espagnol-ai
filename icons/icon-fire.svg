<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>

    <!-- Background: deep space -->
    <radialGradient id="bg" cx="52%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#141826"/>
      <stop offset="100%" stop-color="#0d0f1a"/>
    </radialGradient>

    <!-- ─── Iridescent body ────────────────────────────────────────── -->

    <!-- Iridescent base: deep crimson → orange → amber → gold (solar fire) -->
    <linearGradient id="iris" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%"   stop-color="#1a0400"/>
      <stop offset="22%"  stop-color="#aa2200"/>
      <stop offset="48%"  stop-color="#ff5500"/>
      <stop offset="72%"  stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ffee55"/>
    </linearGradient>

    <!-- Glass form on iridescent body: bright specular top-left, dark bottom-right -->
    <radialGradient id="irisForm" cx="34%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="18%"  stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="48%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
    </radialGradient>

    <!-- Corona: warm glow leaking around the orb's right edge -->
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="#ff5500" stop-opacity="0"/>
      <stop offset="76%"  stop-color="#ff6600" stop-opacity="0.26"/>
      <stop offset="88%"  stop-color="#ffaa00" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffee44" stop-opacity="0"/>
    </radialGradient>

    <!-- ─── Orb (inactive / rest mode) ────────────────────────────── -->

    <!-- Orb: FULLY OPAQUE, terne — muted grey-blue, depth from contrast not gloss -->
    <radialGradient id="orb" cx="35%" cy="30%" r="72%">
      <stop offset="0%"   stop-color="#8898b4"/>
      <stop offset="8%"   stop-color="#3e4e6e"/>
      <stop offset="28%"  stop-color="#161e38"/>
      <stop offset="60%"  stop-color="#070a1c"/>
      <stop offset="100%" stop-color="#03040a"/>
    </radialGradient>

    <!-- Orb ambient bloom — very dim -->
    <radialGradient id="orbBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2a3c58" stop-opacity="0.18"/>
      <stop offset="55%"  stop-color="#2a3c58" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#2a3c58" stop-opacity="0"/>
    </radialGradient>

    <!-- Orb rim glow — barely visible -->
    <radialGradient id="orbRim" cx="50%" cy="50%" r="50%">
      <stop offset="86%"  stop-color="#6070a0" stop-opacity="0"/>
      <stop offset="94%"  stop-color="#7888b0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9aaccf" stop-opacity="0"/>
    </radialGradient>

    <!-- Blur filters -->
    <filter id="blur5"  x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="blur14" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blur26" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

  </defs>

  <!-- 1. Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 2. Iridescent corona — bleeds around the orb's right edge -->
  <circle cx="572" cy="512" r="440" fill="url(#corona)" filter="url(#blur14)"/>

  <!-- 3. Iridescent body — the "sun" being eclipsed, BEHIND the orb -->
  <circle cx="572" cy="512" r="334" fill="url(#iris)"/>

  <!-- 4. Glass form overlay on iridescent body -->
  <circle cx="572" cy="512" r="334" fill="url(#irisForm)"/>

  <!-- 5. Orb ambient bloom (sits in front of iridescent, behind the orb itself) -->
  <circle cx="492" cy="512" r="420" fill="url(#orbBloom)" filter="url(#blur26)"/>

  <!-- 6. Orb — OPAQUE terne glass sphere, eclipses the iridescent body -->
  <!-- offset = 80px → thin crescent (right edge orb 826, right edge iris 906 → 80px crescent) -->
  <circle cx="492" cy="512" r="334" fill="url(#orb)"/>

  <!-- 7. Orb rim glow -->
  <circle cx="492" cy="512" r="334" fill="url(#orbRim)" filter="url(#blur5)"/>

  <!-- 8. Very faint inner highlight — barely-there depth, no gloss -->
  <ellipse cx="452" cy="466" rx="80" ry="58"
    fill="rgba(140,168,210,0.08)" filter="url(#blur5)"/>

</svg>
