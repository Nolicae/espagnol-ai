<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EspañolAI</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EspañolAI">
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0d14; --surface: #13172a; --border: #1e2235;
      --accent: #7c3aed; --accent2: #a855f7;
      --text: #e8eaf0; --muted: #6b7280;
      --red: #ef4444; --amber: #f59e0b;
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, system-ui, sans-serif;
      -webkit-text-size-adjust: 100%; overflow: hidden;
    }
    #app {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; gap: 40px;
      padding: 40px 24px; position: relative;
    }
    #state-label {
      font-size: 1rem; font-weight: 600; letter-spacing: 0.04em;
      color: var(--muted); min-height: 1.4em; transition: color 0.3s;
    }
    #state-label.session       { color: var(--accent2); }
    #state-label.ai-speaking   { color: var(--accent);  }
    #waves { display: flex; align-items: center; gap: 6px; height: 64px; }
    #waves span {
      display: block; width: 6px; border-radius: 3px;
      background: var(--accent); opacity: 0.2;
      animation: w-idle 1.6s ease-in-out infinite;
      transition: opacity 0.3s, background 0.3s;
    }
    #waves span:nth-child(1) { height: 16px; animation-delay: 0.00s; }
    #waves span:nth-child(2) { height: 30px; animation-delay: 0.15s; }
    #waves span:nth-child(3) { height: 48px; animation-delay: 0.30s; }
    #waves span:nth-child(4) { height: 30px; animation-delay: 0.15s; }
    #waves span:nth-child(5) { height: 16px; animation-delay: 0.00s; }
    #waves.session     span { opacity: 1;   background: var(--accent2); animation-name: w-listen; }
    #waves.ai-speaking span { opacity: 0.9; background: var(--accent);  animation-name: w-speak;  }
    @keyframes w-idle   { 0%,100%{transform:scaleY(.6)} 50%{transform:scaleY(1)}   }
    @keyframes w-listen { 0%,100%{transform:scaleY(.7)} 50%{transform:scaleY(1.4)} }
    @keyframes w-think  { 0%,100%{transform:scaleY(.8)} 50%{transform:scaleY(1.1)} }
    @keyframes w-speak  { 0%,100%{transform:scaleY(.5)} 50%{transform:scaleY(1.5)} }
    #mic-btn {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
      font-size: 2.4rem; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 32px rgba(124,58,237,.4);
      transition: background .2s, opacity .2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: none; user-select: none;
    }
    #mic-btn.active { background: var(--accent2); animation: sonar 1.2s ease-out infinite; }
    @keyframes sonar {
      0%  { box-shadow: 0 0 0 0    rgba(168,85,247,.7); }
      70% { box-shadow: 0 0 0 32px rgba(168,85,247,0);  }
      100%{ box-shadow: 0 0 0 0    rgba(168,85,247,0);  }
    }
    #subtitle {
      font-size: 0.88rem; color: var(--muted); font-style: italic;
      text-align: center; max-width: 300px; min-height: 2.6em; line-height: 1.6;
    }
    #settings-btn {
      position: absolute; top: 20px; right: 20px;
      background: none; border: none; color: var(--muted);
      font-size: 1.4rem; cursor: pointer; padding: 8px;
    }
    #settings-panel {
      position: absolute; inset: 0; background: var(--bg); z-index: 10;
      display: none; flex-direction: column; align-items: center;
      justify-content: center; padding: 32px 24px; gap: 16px;
      overflow-y: auto;
    }
    #settings-panel.open { display: flex; }
    #settings-panel h2 { font-size: 1.2rem; margin-bottom: 4px; }
    #settings-close {
      position: absolute; top: 20px; right: 20px;
      background: none; border: none; color: var(--muted);
      font-size: 1.6rem; cursor: pointer; padding: 8px;
    }
    .key-group { width: 100%; max-width: 360px; text-align: left; }
    .key-group label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
    .key-group input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 16px; color: var(--text);
      font-size: 0.95rem; outline: none; -webkit-appearance: none;
    }
    .key-group input:focus { border-color: var(--accent); }
    .s-save { width:100%; max-width:360px; background:var(--accent); color:#fff; border:none; border-radius:14px; padding:14px; font-size:1rem; font-weight:700; cursor:pointer; margin-top:4px; }
    .s-out  { background:none; border:1px solid var(--border); color:var(--muted); border-radius:12px; padding:10px 20px; cursor:pointer; font-size:0.85rem; }
  </style>
</head>
<body>

<div id="app">
  <button id="settings-btn">⚙️</button>
  <div id="state-label">Toca para comenzar</div>
  <div id="waves"><span></span><span></span><span></span><span></span><span></span></div>
  <button id="mic-btn">🎤</button>
  <div id="subtitle"></div>

  <div id="settings-panel">
    <button id="settings-close">✕</button>
    <h2>⚙️ Paramètres</h2>
    <div class="key-group">
      <label>Clé Groq</label>
      <input id="s-groq" type="password" placeholder="gsk_…">
    </div>
    <button class="s-save" id="s-save">Sauvegarder</button>
    <button class="s-out"  id="s-out">Réinitialiser</button>
  </div>
</div>

<script>
'use strict';

// ── Config ───────────────────────────────────────────────────
const GROQ_STT   = 'https://api.groq.com/openai/v1/audio/transcriptions';
const GROQ_CHAT  = 'https://api.groq.com/openai/v1/chat/completions';
const GROQ_MODEL = 'llama-3.3-70b-versatile';
const HIST_MAX   = 10;


const SYSTEM = `Eres un hablante nativo de español muy amigable y conversacional.
Responde SIEMPRE en español, de forma natural y breve (máximo 2-3 frases).
Si el usuario comete errores gramaticales, corrígelos sutilmente en tu respuesta.`;

// ── Keys ─────────────────────────────────────────────────────
const groqKey = () => localStorage.getItem('groq_key') || '';

// ── DOM ──────────────────────────────────────────────────────
const $        = id => document.getElementById(id);
const stateLbl = $('state-label');
const wavesEl  = $('waves');
const micBtn   = $('mic-btn');
const subEl    = $('subtitle');
const sPanel   = $('settings-panel');

// ── App state ────────────────────────────────────────────────
let appState = 'inactive';
let recorder = null, chunks = [], mimeType = '';
let history  = [];

// ── UI ───────────────────────────────────────────────────────
function setState(s) {
  appState = s;
  stateLbl.textContent = {
    inactive:      'Toca para comenzar',
    session:       '🎙 Sesión activa',
    'ai-speaking': '🔊 Hablando…',
  }[s] ?? '';
  stateLbl.className = s;
  wavesEl.className  = s;
  micBtn.classList.toggle('active', s === 'session' || s === 'ai-speaking');
}

const setSub = t => { subEl.textContent = t; };

// ── Audio context (unlocked by user gesture; stays authorized across async on iOS) ──
let audioCtx = null;

function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume().catch(() => {});
}

// ── TTS via Vercel proxy → Google Translate TTS → AudioContext ────────────────
// Google TTS has a ~200 char limit per request, so split at sentence boundaries.
function splitText(text, max = 180) {
  const parts = text.match(/[^.!?]+[.!?]*/g) || [text];
  const chunks = [];
  let cur = '';
  for (const p of parts) {
    if (cur.length + p.length > max && cur) { chunks.push(cur.trim()); cur = p; }
    else cur += p;
  }
  if (cur.trim()) chunks.push(cur.trim());
  return chunks;
}

async function speakChunk(text) {
  const r = await fetch(`/api/tts?text=${encodeURIComponent(text)}`);
  if (!r.ok) throw new Error(`TTS ${r.status}`);
  const decoded = await audioCtx.decodeAudioData(await r.arrayBuffer());
  const src = audioCtx.createBufferSource();
  src.buffer = decoded;
  src.connect(audioCtx.destination);
  return new Promise(resolve => { src.onended = resolve; src.start(0); });
}

async function speak(text) {
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  for (const chunk of splitText(text)) await speakChunk(chunk);
}

// ── MediaRecorder ────────────────────────────────────────────
function initMime() {
  for (const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']) {
    if (MediaRecorder.isTypeSupported(t)) { mimeType = t; return; }
  }
}

async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks   = [];
    recorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = onStop;
    recorder.start();
    setState('listening');
  } catch (e) {
    setSub(`⚠️ Micro : ${e.message}`);
    setState('idle');
  }
}

function stopRec() {
  if (!recorder || recorder.state === 'inactive') return;
  recorder.stop();
  recorder.stream.getTracks().forEach(t => t.stop());
}

// ── Pipeline ─────────────────────────────────────────────────
async function onStop() {
  if (!chunks.length) { setState('idle'); return; }
  const type = recorder.mimeType || mimeType || 'audio/webm';
  const blob = new Blob(chunks, { type });

  setState('thinking');
  setSub('');

  try {
    const transcript = await stt(blob, type);
    if (!transcript.trim()) { setState('idle'); setSub('(rien capté)'); return; }
    setSub(`« ${transcript} »`);
    history.push({ role: 'user', content: transcript });
    if (history.length > HIST_MAX * 2) history = history.slice(-HIST_MAX * 2);

    const reply = await llm();
    history.push({ role: 'assistant', content: reply });
    if (history.length > HIST_MAX * 2) history = history.slice(-HIST_MAX * 2);

    setState('speaking');
    setSub(reply);
    await speak(reply);

  } catch (e) {
    setSub(`⚠️ ${e.message}`);
  } finally {
    setState('idle');
  }
}

// ── STT ──────────────────────────────────────────────────────
async function stt(blob, type) {
  const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
  const fd  = new FormData();
  fd.append('file', blob, `rec.${ext}`);
  fd.append('model', 'whisper-large-v3');
  fd.append('language', 'es');
  fd.append('response_format', 'json');
  const r = await fetch(GROQ_STT, {
    method:  'POST',
    headers: { Authorization: `Bearer ${groqKey()}` },
    body:    fd,
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error?.message || `STT ${r.status}`); }
  return (await r.json()).text || '';
}

// ── LLM ──────────────────────────────────────────────────────
async function llm() {
  const r = await fetch(GROQ_CHAT, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${groqKey()}` },
    body: JSON.stringify({
      model:      GROQ_MODEL,
      max_tokens: 200,
      messages:   [{ role: 'system', content: SYSTEM }, ...history],
    }),
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error?.message || `LLM ${r.status}`); }
  return (await r.json()).choices[0]?.message?.content || '';
}

// ── Mic button ───────────────────────────────────────────────
micBtn.addEventListener('click', e => {
  e.preventDefault();
  unlockAudio();
  if (!sessionActive) startSession();
  else stopSession();
});

// ── Settings ─────────────────────────────────────────────────
$('settings-btn').addEventListener('click', () => {
  $('s-groq').value = groqKey();
  sPanel.classList.add('open');
});
$('settings-close').addEventListener('click', () => sPanel.classList.remove('open'));
$('s-save').addEventListener('click', () => {
  localStorage.setItem('groq_key', $('s-groq').value.trim());
  sPanel.classList.remove('open');
});
$('s-out').addEventListener('click', () => { localStorage.clear(); location.reload(); });

// ── Boot ─────────────────────────────────────────────────────
initMime();
setState('inactive');
setSub('');
</script>
</body>
</html>
