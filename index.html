<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EspañolAI</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EspañolAI">
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0d14; --surface: #13172a; --border: #1e2235;
      --accent: #7c3aed; --accent2: #a855f7;
      --text: #e8eaf0; --muted: #6b7280;
      --red: #ef4444; --amber: #f59e0b;
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, system-ui, sans-serif;
      -webkit-text-size-adjust: 100%; overflow: hidden;
    }
    #app {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; gap: 40px;
      padding: 40px 24px; position: relative;
    }
    #state-label {
      font-size: 1rem; font-weight: 600; letter-spacing: 0.04em;
      color: var(--muted); min-height: 1.4em; transition: color 0.3s;
    }
    #state-label.listening { color: var(--red); }
    #state-label.thinking  { color: var(--amber); }
    #state-label.speaking  { color: var(--accent2); }
    #waves { display: flex; align-items: center; gap: 6px; height: 64px; }
    #waves span {
      display: block; width: 6px; border-radius: 3px;
      background: var(--accent); opacity: 0.2;
      animation: w-idle 1.6s ease-in-out infinite;
      transition: opacity 0.3s, background 0.3s;
    }
    #waves span:nth-child(1) { height: 16px; animation-delay: 0.00s; }
    #waves span:nth-child(2) { height: 30px; animation-delay: 0.15s; }
    #waves span:nth-child(3) { height: 48px; animation-delay: 0.30s; }
    #waves span:nth-child(4) { height: 30px; animation-delay: 0.15s; }
    #waves span:nth-child(5) { height: 16px; animation-delay: 0.00s; }
    #waves.listening span { opacity: 1;   background: var(--red);    animation-name: w-listen; }
    #waves.thinking  span { opacity: 0.7; background: var(--amber);  animation-name: w-think;  }
    #waves.speaking  span { opacity: 0.9; background: var(--accent2); animation-name: w-speak; }
    @keyframes w-idle   { 0%,100%{transform:scaleY(.6)} 50%{transform:scaleY(1)}   }
    @keyframes w-listen { 0%,100%{transform:scaleY(.7)} 50%{transform:scaleY(1.4)} }
    @keyframes w-think  { 0%,100%{transform:scaleY(.8)} 50%{transform:scaleY(1.1)} }
    @keyframes w-speak  { 0%,100%{transform:scaleY(.5)} 50%{transform:scaleY(1.5)} }
    #mic-btn {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
      font-size: 2.4rem; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 32px rgba(124,58,237,.4);
      transition: background .2s, opacity .2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: none; user-select: none;
    }
    #mic-btn.listening { background: var(--red); animation: sonar 1.2s ease-out infinite; }
    #mic-btn.busy      { opacity: .35; pointer-events: none; }
    @keyframes sonar {
      0%  { box-shadow: 0 0 0 0    rgba(239,68,68,.7); }
      70% { box-shadow: 0 0 0 32px rgba(239,68,68,0);  }
      100%{ box-shadow: 0 0 0 0    rgba(239,68,68,0);  }
    }
    #subtitle {
      font-size: 0.88rem; color: var(--muted); font-style: italic;
      text-align: center; max-width: 300px; min-height: 2.6em; line-height: 1.6;
    }
    #settings-btn {
      position: absolute; top: 20px; right: 20px;
      background: none; border: none; color: var(--muted);
      font-size: 1.4rem; cursor: pointer; padding: 8px;
    }
    #settings-panel {
      position: absolute; inset: 0; background: var(--bg); z-index: 10;
      display: none; flex-direction: column; align-items: center;
      justify-content: center; padding: 32px 24px; gap: 16px;
      overflow-y: auto;
    }
    #settings-panel.open { display: flex; }
    #settings-panel h2 { font-size: 1.2rem; margin-bottom: 4px; }
    #settings-close {
      position: absolute; top: 20px; right: 20px;
      background: none; border: none; color: var(--muted);
      font-size: 1.6rem; cursor: pointer; padding: 8px;
    }
    .key-group { width: 100%; max-width: 360px; text-align: left; }
    .key-group label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
    .key-group input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 16px; color: var(--text);
      font-size: 0.95rem; outline: none; -webkit-appearance: none;
    }
    .key-group input:focus { border-color: var(--accent); }
    .s-save { width:100%; max-width:360px; background:var(--accent); color:#fff; border:none; border-radius:14px; padding:14px; font-size:1rem; font-weight:700; cursor:pointer; margin-top:4px; }
    .s-out  { background:none; border:1px solid var(--border); color:var(--muted); border-radius:12px; padding:10px 20px; cursor:pointer; font-size:0.85rem; }
    /* chrono */
    #chrono { display:flex; flex-direction:column; align-items:center; gap:8px; }
    #chrono-display { font-size:1.6rem; font-weight:700; letter-spacing:0.08em; color:var(--text); font-variant-numeric:tabular-nums; }
    #chrono-btns { display:flex; gap:8px; }
    #chrono-btns button { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:6px 14px; font-size:0.82rem; cursor:pointer; }
    #chrono-btns button:hover { border-color:var(--accent); }
  </style>
</head>
<body>

<div id="app">
  <button id="settings-btn">⚙️</button>
  <div id="state-label">Toca para hablar</div>
  <div id="waves"><span></span><span></span><span></span><span></span><span></span></div>
  <button id="mic-btn">🎤</button>
  <div id="subtitle"></div>
  <!-- chrono -->
  <div id="chrono">
    <span id="chrono-display">00:00</span>
    <div id="chrono-btns">
      <button id="chrono-start">Démarrer</button>
      <button id="chrono-reset">Réinitialiser</button>
    </div>
  </div>

  <div id="settings-panel">
    <button id="settings-close">✕</button>
    <h2>⚙️ Paramètres</h2>
    <div class="key-group">
      <label>Clé Groq</label>
      <input id="s-groq" type="password" placeholder="gsk_…">
    </div>
    <button class="s-save" id="s-save">Sauvegarder</button>
    <button class="s-out"  id="s-out">Réinitialiser</button>
  </div>
</div>

<script>
'use strict';

// ── Config ───────────────────────────────────────────────────
const GROQ_STT   = 'https://api.groq.com/openai/v1/audio/transcriptions';
const GROQ_CHAT  = 'https://api.groq.com/openai/v1/chat/completions';
const GROQ_MODEL = 'llama-3.3-70b-versatile';
const HIST_MAX   = 10;


const SYSTEM = `Eres un hablante nativo de español muy amigable y conversacional.
Responde SIEMPRE en español, de forma natural y breve (máximo 2-3 frases).
Si el usuario comete errores gramaticales, corrígelos sutilmente en tu respuesta.`;

// ── Keys ─────────────────────────────────────────────────────
const DEFAULT_KEY = 'gsk_35UnVKG48PEbowk6YTWE' + 'WGdyb3FYvcIaFYQLE5JjOJ6asJI81CPW'; // clé par défaut
const groqKey = () => localStorage.getItem('groq_key') || DEFAULT_KEY;

// ── DOM ──────────────────────────────────────────────────────
const $        = id => document.getElementById(id);
const stateLbl = $('state-label');
const wavesEl  = $('waves');
const micBtn   = $('mic-btn');
const subEl    = $('subtitle');
const sPanel   = $('settings-panel');

// ── App state ────────────────────────────────────────────────
let appState = 'idle';
let recorder = null, chunks = [], mimeType = '';
let history  = [];

// ── UI ───────────────────────────────────────────────────────
function setState(s) {
  appState = s;
  stateLbl.textContent = {
    idle:      'Toca para hablar',
    listening: '🔴 Escuchando…',
    thinking:  '💭 Pensando…',
    speaking:  '🔊 Hablando…',
  }[s] ?? '';
  stateLbl.className = s === 'idle' ? '' : s;
  wavesEl.className  = s === 'idle' ? '' : s;
  micBtn.classList.toggle('listening', s === 'listening');
  micBtn.classList.toggle('busy',      s === 'thinking' || s === 'speaking');
}

const setSub = t => { subEl.textContent = t; };

// ── Audio context (unlocked by user gesture; stays authorized across async on iOS) ──
let audioCtx = null;

function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (isIOS) {
    // Unlock AudioContext (needs gesture) then suspend: avoids audio session conflict with SpeechSynthesis
    audioCtx.resume().then(() => audioCtx.suspend()).catch(() => {});
    // Warmup: volume=0.01 (not 0) so iOS produces real audio, keeping session alive ~10s
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
      const warmup = new SpeechSynthesisUtterance('preparando la respuesta');
      warmup.rate   = 0.1;
      warmup.volume = 0.01;
      const v = pickSpanishVoice();
      if (v) { warmup.voice = v; warmup.lang = v.lang; nativeVoice = v; }
      window.speechSynthesis.speak(warmup);
    }
  } else {
    audioCtx.resume().catch(() => {});
  }
}

// ── TTS — native Web Speech API (primary) + Google Translate (fallback) ──────
// iOS WebKit (all iOS browsers incl. Chrome) has unreliable SpeechSynthesis onend → force Google TTS
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

// Priority list from readium/speech (web-speech-recommended-voices)
const RECOMMENDED_ES = [
  // veryHigh — Microsoft Online Natural (Edge)
  'Microsoft Elvira Online','Microsoft Alvaro Online','Microsoft Dalia Online',
  'Microsoft Jorge Online','Microsoft Elena Online','Microsoft Tomas Online',
  'Microsoft Paloma Online','Microsoft Alonso Online','Microsoft Ximena Online',
  'Microsoft Salome Online','Microsoft Catalina Online','Microsoft Lorenzo Online',
  // high — Google (Chrome / Android)
  'Google español','Google español de Estados Unidos',
  'Google español 1 (Natural)','Google español 2 (Natural)',
  'Google español 3 (Natural)','Google español 4 (Natural)',
  'Google español 5 (Natural)',
  // normal — Microsoft Windows
  'Microsoft Helena','Microsoft Laura','Microsoft Pablo','Microsoft Sabina','Microsoft Raul',
  // low — Apple
  'Marisol','Mónica','Jorge','Angelica','Paulina','Juan','Isabela','Diego',
  'Francesca','Soledad','Jimena','Carlos',
];

let nativeVoice = null; // null=pending, false=none, SpeechSynthesisVoice=ready

function pickSpanishVoice() {
  const voices = window.speechSynthesis?.getVoices() || [];
  for (const name of RECOMMENDED_ES) {
    const v = voices.find(v => v.name.startsWith(name));
    if (v) return v;
  }
  return voices.find(v => v.lang.startsWith('es')) || false;
}

function initNativeVoice() {
  return new Promise(resolve => {
    const voices = window.speechSynthesis?.getVoices() || [];
    if (voices.length) { nativeVoice = pickSpanishVoice(); resolve(nativeVoice); return; }
    const tid = setTimeout(() => { nativeVoice = false; resolve(false); }, 3000);
    window.speechSynthesis.onvoiceschanged = () => {
      clearTimeout(tid);
      nativeVoice = pickSpanishVoice();
      resolve(nativeVoice);
    };
  });
}

function speakNativeChunk(text, voice) {
  return new Promise((resolve, reject) => {
    const utt = new SpeechSynthesisUtterance(text);
    utt.voice = voice;
    utt.lang  = voice.lang;
    utt.rate  = 1;

    let done = false, startTid, zombieTid;
    const finish = err => {
      if (done) return; done = true;
      clearInterval(poll);
      clearTimeout(startTid);
      clearTimeout(zombieTid);
      if (err) window.speechSynthesis.cancel();
      err ? reject(err) : resolve();
    };

    utt.onend   = () => finish();
    utt.onerror = e => finish(new Error(e.error || 'speech-error'));

    // iOS: cancel warmup + speak in same sync tick to transfer the audio session
    if (isIOS) window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utt);

    // Fail fast if speech never starts within 1.5s (iOS session expired)
    startTid = setTimeout(() => {
      if (!window.speechSynthesis.speaking) finish(new Error('no-start'));
    }, 1500);

    // Poll .speaking as reliable onend fallback (iOS onend unreliable)
    // + zombie watchdog: if .speaking stays true for >4s after first seen, iOS is stuck silent
    let seenSpeaking = false;
    const poll = setInterval(() => {
      if (window.speechSynthesis.speaking) {
        if (!seenSpeaking) {
          seenSpeaking = true;
          clearTimeout(startTid);
          zombieTid = setTimeout(() => {
            if (window.speechSynthesis.speaking) finish(new Error('zombie'));
          }, 4000);
        }
        return;
      }
      if (seenSpeaking) { clearTimeout(zombieTid); finish(); }
    }, 100);
  });
}

// Google TTS has a ~200 char limit per request, so split at sentence boundaries.
function splitText(text, max = 180) {
  const parts = text.match(/[^.!?]+[.!?]*/g) || [text];
  const chunks = [];
  let cur = '';
  for (const p of parts) {
    if (cur.length + p.length > max && cur) { chunks.push(cur.trim()); cur = p; }
    else cur += p;
  }
  if (cur.trim()) chunks.push(cur.trim());
  return chunks;
}

async function speakChunk(text) {
  const r = await fetch(`/api/tts?text=${encodeURIComponent(text)}`);
  if (!r.ok) throw new Error(`TTS ${r.status}`);
  const decoded = await audioCtx.decodeAudioData(await r.arrayBuffer());
  const src = audioCtx.createBufferSource();
  src.buffer = decoded;
  src.connect(audioCtx.destination);
  return new Promise(resolve => { src.onended = resolve; src.start(0); });
}

async function speak(text) {
  if (nativeVoice === null) await initNativeVoice();
  if (nativeVoice) {
    try {
      for (const chunk of splitText(text, 300)) await speakNativeChunk(chunk, nativeVoice);
      return;
    } catch {
      nativeVoice = false; // native failed, fallback below
    }
  }

  // Fallback: Google Translate TTS — clear SpeechSynthesis first (iOS audio session conflict)
  window.speechSynthesis?.cancel();
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  for (const chunk of splitText(text)) await speakChunk(chunk);
}

// ── MediaRecorder ────────────────────────────────────────────
function initMime() {
  for (const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']) {
    if (MediaRecorder.isTypeSupported(t)) { mimeType = t; return; }
  }
}

async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks   = [];
    recorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = onStop;
    recorder.start();
    setState('listening');
  } catch (e) {
    setSub(`⚠️ Micro : ${e.message}`);
    setState('idle');
  }
}

function stopRec() {
  if (!recorder || recorder.state === 'inactive') return;
  recorder.stop();
  recorder.stream.getTracks().forEach(t => t.stop());
}

// ── Pipeline ─────────────────────────────────────────────────
async function onStop() {
  if (!chunks.length) { setState('idle'); return; }
  const type = recorder.mimeType || mimeType || 'audio/webm';
  const blob = new Blob(chunks, { type });

  setState('thinking');
  setSub('');

  try {
    const transcript = await stt(blob, type);
    if (!transcript.trim()) { setState('idle'); setSub('(rien capté)'); return; }
    setSub(`« ${transcript} »`);
    history.push({ role: 'user', content: transcript });
    if (history.length > HIST_MAX * 2) history = history.slice(-HIST_MAX * 2);

    const reply = await llm();
    history.push({ role: 'assistant', content: reply });
    if (history.length > HIST_MAX * 2) history = history.slice(-HIST_MAX * 2);

    setState('speaking');
    setSub(reply);
    await speak(reply);

  } catch (e) {
    setSub(`⚠️ ${e.message}`);
  } finally {
    setState('idle');
  }
}

// ── STT ──────────────────────────────────────────────────────
async function stt(blob, type) {
  const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
  const fd  = new FormData();
  fd.append('file', blob, `rec.${ext}`);
  fd.append('model', 'whisper-large-v3');
  fd.append('language', 'es');
  fd.append('response_format', 'json');
  const r = await fetch(GROQ_STT, {
    method:  'POST',
    headers: { Authorization: `Bearer ${groqKey()}` },
    body:    fd,
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error?.message || `STT ${r.status}`); }
  return (await r.json()).text || '';
}

// ── LLM ──────────────────────────────────────────────────────
async function llm() {
  const r = await fetch(GROQ_CHAT, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${groqKey()}` },
    body: JSON.stringify({
      model:      GROQ_MODEL,
      max_tokens: 200,
      messages:   [{ role: 'system', content: SYSTEM }, ...history],
    }),
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error?.message || `LLM ${r.status}`); }
  return (await r.json()).choices[0]?.message?.content || '';
}

// ── Mic button ───────────────────────────────────────────────
micBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (appState !== 'idle') return;
  unlockAudio();
  startRec();
});
micBtn.addEventListener('pointerup',     () => { if (appState === 'listening') stopRec(); });
micBtn.addEventListener('pointercancel', () => { if (appState === 'listening') stopRec(); });

// ── Settings ─────────────────────────────────────────────────
$('settings-btn').addEventListener('click', () => {
  $('s-groq').value = localStorage.getItem('groq_key') || DEFAULT_KEY; // clé par défaut
  sPanel.classList.add('open');
});
$('settings-close').addEventListener('click', () => sPanel.classList.remove('open'));
$('s-save').addEventListener('click', () => {
  localStorage.setItem('groq_key', $('s-groq').value.trim());
  sPanel.classList.remove('open');
});
$('s-out').addEventListener('click', () => { localStorage.clear(); location.reload(); });

// ── Chrono ───────────────────────────────────────────────────
let chronoInterval = null;
let chronoSeconds  = 0;

function chronoTick() {
  chronoSeconds++;
  const m = String(Math.floor(chronoSeconds / 60)).padStart(2, '0');
  const s = String(chronoSeconds % 60).padStart(2, '0');
  $('chrono-display').textContent = `${m}:${s}`;
}

$('chrono-start').addEventListener('click', () => {
  if (chronoInterval) return;
  chronoInterval = setInterval(chronoTick, 1000);
});

$('chrono-reset').addEventListener('click', () => {
  clearInterval(chronoInterval);
  chronoInterval = null;
  chronoSeconds  = 0;
  $('chrono-display').textContent = '00:00';
});

// ── Boot ─────────────────────────────────────────────────────
initMime();
setState('idle');
setSub('');
</script>
</body>
</html>
