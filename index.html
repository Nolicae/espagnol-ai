<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Espagnolai — Ondas</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Espagnolai">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">

  <!-- Fonts Ondas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Serif+Display:ital@0;1&family=Crimson+Pro:ital,wght@0,300;0,400;1,400&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Ondas Aurora palette (default) */
      --bg1: #2A2E48;
      --bg2: #181B2D;
      --bg3: #0D0F1A;
      --peach: #E8B8C8;
      --peachDk: #C98EA0;
      --lilac: #B8DAC8;
      --lilacDk: #8FB39E;
      --sage: #C8E0D2;
      --ink: #E8E6F0;
      --inkSoft: rgba(255,255,255,0.62);
      --inkDim: rgba(255,255,255,0.32);
      --rule: rgba(255,255,255,0.08);
      --sans: 'Geist', system-ui, sans-serif;
      --mono: 'Geist Mono', monospace;
      --serif: 'Instrument Serif', Georgia, serif;
    }

    /* Palette themes */
    :root.pal-dusk {
      --bg1: #3A2F4A; --bg2: #231E33; --bg3: #15111E;
      --peach: #F2B8A2; --peachDk: #E08F73; --lilac: #C8B8E3; --lilacDk: #9E8FBA;
      --sage: #BAD6C2; --ink: #EDE7F0;
    }
    :root.pal-mist {
      --bg1: #2E3A3D; --bg2: #1A2326; --bg3: #0E1416;
      --peach: #E8D4B5; --peachDk: #C9B58E; --lilac: #B5D4CE; --lilacDk: #8FB0AA;
      --sage: #C8DCD0; --ink: #E8EDEC;
    }
    :root.pal-cocoa {
      --bg1: #3D2F26; --bg2: #241A14; --bg3: #13100D;
      --peach: #E8A578; --peachDk: #C77F4C; --lilac: #D8C5A8; --lilacDk: #B09877;
      --sage: #C9B894; --ink: #F0E8DD;
    }
    :root.pal-graphite {
      --bg1: #2D2D33; --bg2: #1A1A1F; --bg3: #0E0E11;
      --peach: #E8DCC8; --peachDk: #C9BA9C; --lilac: #BFC5D2; --lilacDk: #959DAC;
      --sage: #C8D2C0; --ink: #E8E8EC;
    }

    html, body {
      height: 100%;
      background: var(--bg1);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-text-size-adjust: 100%;
      overflow: hidden;
    }

    #app {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100%;
      background:
        radial-gradient(140% 100% at 50% 0%,
          hsla(var(--hue-dyn, 30), 65%, 62%, 0.12) 0%,
          hsla(var(--hue-dyn, 30), 60%, 50%, 0.06) 45%,
          var(--bg3) 100%),
        radial-gradient(140% 100% at 50% 0%, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
      position: relative;
    }

    /* Main container */
    .app-container {
      position: relative;
      width: 100%;
      max-width: 402px;
      height: 100vh;
      max-height: 874px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Screen: Conversation */
    .screen-conversation {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      padding: 0;
      position: relative;
      gap: 0;
    }

    .screen-conversation.hidden { display: none; }

    /* HUD */
    .hud {
      position: absolute;
      top: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .hud-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 2px;
      color: var(--inkSoft);
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--sage);
      box-shadow: 0 0 8px var(--sage);
      animation: blink 1.6s ease-in-out infinite;
    }

    .status-dot.listening { animation: none; }

    .hud-controls {
      display: flex;
      gap: 12px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Voice pill */
    .voice-pill {
      position: absolute;
      top: 130px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px 6px 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--rule);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .voice-pill-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent, var(--peach));
      filter: blur(0.5px);
    }

    .voice-pill-text {
      font-family: var(--sans);
      font-size: 13px;
      color: var(--ink);
      letter-spacing: 0.2px;
      font-weight: 400;
    }

    /* Orb container */
    .orb-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 372px;
      height: 372px;
      z-index: 5;
    }

    .orb-btn {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb-btn svg {
      filter: drop-shadow(0 0 8px var(--accent, var(--peach)));
      transition: filter 0.3s ease;
    }

    /* Timer */
    .timer-container {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
      pointer-events: none;
    }

    .timer {
      font-family: var(--serif);
      font-weight: 300;
      font-size: 52px;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, var(--ink) 55%, rgba(255,255,255,0.55) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .timer-colon {
      display: inline-block;
      font-style: normal;
      font-weight: 300;
      font-size: 0.5em;
      vertical-align: 0.34em;
      padding: 0 0.36em;
      letter-spacing: 0;
      transition: all 600ms ease;
    }

    .timer-progress {
      position: relative;
      width: 240px;
      height: 14px;
      margin: 14px auto 0;
    }

    .timer-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, transparent 0%, var(--rule) 12%, var(--rule) 88%, transparent 100%);
    }

    .timer-fill {
      position: absolute;
      left: 0;
      top: 50%;
      height: 1px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, transparent 0%, var(--accent, var(--peach)) 35%, var(--accent, var(--peach)) 100%);
      box-shadow: 0 0 8px var(--accent, var(--peach))80, 0 0 14px var(--accent, var(--peach))40;
      transition: width 600ms ease, background 600ms ease, box-shadow 600ms ease;
    }

    .timer-dot {
      position: absolute;
      top: 50%;
      width: 12px;
      height: 12px;
      transform: translateY(-50%);
      border-radius: 50%;
      background: var(--accent, var(--peach));
      box-shadow: 0 0 8px var(--accent, var(--peach));
      filter: blur(0.4px);
      transition: left 100ms ease;
    }

    .timer-labels {
      display: flex;
      justify-content: space-between;
      max-width: 240px;
      margin: 10px auto 0;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--inkDim);
      letter-spacing: 1.4px;
    }


    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--rule);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      color: var(--ink);
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .icon-btn:hover {
      border-color: var(--accent, var(--peach));
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Screen: Settings (Ajustes) */
    .screen-settings {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      padding: 0;
      position: relative;
      overflow-y: auto;
    }

    .screen-settings.hidden { display: none; }

    .settings-header {
      position: absolute;
      top: 62px;
      left: 24px;
      right: 24px;
      z-index: 20;
    }

    .settings-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .settings-close-btn {
      background: transparent;
      border: none;
      color: var(--inkSoft);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .settings-subtitle {
      font-family: var(--serif);
      font-weight: 300;
      font-size: 36px;
      line-height: 1.05;
      letter-spacing: -0.4px;
      margin-top: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, var(--ink) 55%, rgba(255,255,255,0.55) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .settings-section-label {
      position: absolute;
      top: 184px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 2px;
      color: var(--inkDim);
      text-transform: uppercase;
      z-index: 20;
    }

    .voices-grid {
      position: absolute;
      top: 212px;
      left: 24px;
      right: 24px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .voice-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--rule);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--sans);
      font-size: 11px;
      color: var(--ink);
      text-align: left;
    }

    .voice-btn:hover {
      background: rgba(255,255,255,0.08);
    }

    .voice-btn[data-selected="true"] {
      border-color: var(--accent, var(--peach));
      background: rgba(201,100,66,0.08);
      box-shadow: 0 0 0 1.5px var(--accent, var(--peach)) inset;
      color: var(--accent, var(--peach));
    }

    .voice-dot-mini {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .voice-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .settings-selected-voice {
      position: absolute;
      top: 524px;
      left: 24px;
      right: 24px;
      text-align: center;
    }

    .selected-voice-name {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 34px;
      line-height: 1;
      letter-spacing: -0.3px;
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, var(--accent, var(--peach)) 55%, rgba(255,255,255,0.55) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .selected-voice-city {
      font-family: var(--serif);
      font-style: italic;
      font-size: 17px;
      color: var(--inkSoft);
      margin-top: 2px;
    }

    .selected-voice-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--inkDim);
      letter-spacing: 2.2px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    /* Session duration */
    .settings-duration {
      position: absolute;
      top: 614px;
      left: 24px;
      right: 24px;
    }

    .duration-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .duration-label-text {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 2px;
      color: var(--inkDim);
      text-transform: uppercase;
    }

    .duration-value {
      font-family: var(--serif);
      font-weight: 300;
      font-size: 44px;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, var(--ink) 55%, rgba(255,255,255,0.55) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .duration-min {
      font-family: var(--serif);
      font-style: italic;
      font-size: 16px;
      color: var(--inkSoft);
      margin-left: 6px;
    }

    .duration-slider-container {
      position: relative;
      height: 36px;
      margin-top: 12px;
    }

    .duration-slider {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      margin: 0;
    }

    .duration-track {
      position: absolute;
      top: 17px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--rule);
      border-radius: 1px;
    }

    .duration-fill {
      position: absolute;
      top: 17px;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--lilac), var(--accent, var(--peach)));
      box-shadow: 0 0 14px var(--accent, var(--peach))88;
      border-radius: 1px;
      transition: width 0.1s ease;
    }

    .duration-thumb {
      position: absolute;
      top: 8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 1.5px var(--accent, var(--peach)), 0 0 16px var(--accent, var(--peach))aa;
      pointer-events: none;
      transition: left 0.1s ease;
    }

    .duration-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--inkDim);
      letter-spacing: 1.5px;
    }

    /* Save button */
    .settings-save {
      position: absolute;
      bottom: 62px;
      left: 24px;
      right: 24px;
      width: calc(100% - 48px);
      padding: 16px;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.26) 0%,
        rgba(255,255,255,0.06) 40%,
        rgba(255,255,255,0) 100%
      ), linear-gradient(
        120deg,
        var(--lilac) 0%,
        var(--lilac) 32%,
        var(--accent, var(--peach)) 68%,
        var(--peach) 100%
      );
      border: none;
      border-radius: 999px;
      color: #1A1424;
      font-family: var(--sans);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.55),
        inset 0 -1px 0 rgba(0,0,0,0.18),
        0 0 32px var(--accent, var(--peach))55,
        0 6px 22px rgba(0,0,0,0.22);
      transition: all 250ms ease;
    }

    .settings-save:hover {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.65),
        inset 0 -1px 0 rgba(0,0,0,0.22),
        0 0 40px var(--accent, var(--peach))66,
        0 8px 28px rgba(0,0,0,0.28);
    }

    /* Scrollbar styling */
    .voices-grid::-webkit-scrollbar {
      width: 6px;
    }
    .voices-grid::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
    }
  </style>
</head>
<body>

<div id="app">
  <div class="app-container">

    <!-- ═══ Screen: Conversation ═══ -->
    <div class="screen-conversation" id="screen-conversation">
      <!-- HUD -->
      <div class="hud">
        <div class="hud-status">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">Inactivo</span>
        </div>
        <div class="hud-controls">
          <button class="icon-btn" id="btn-reset" title="reiniciar">
            <svg viewBox="0 0 16 16">
              <path d="M2 8a6 6 0 1 1 6 6M2 8v-4M2 8h4" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-settings" title="ajustes">
            <svg viewBox="0 0 16 16">
              <circle cx="8" cy="8" r="1.6"/>
              <path d="M8 2v1.4M8 12.6V14M2 8h1.4M12.6 8H14M3.5 3.5l1 1M11.5 11.5l1 1M3.5 12.5l1-1M11.5 4.5l1-1" />
            </svg>
          </button>
        </div>
      </div>


      <!-- Orb -->
      <div class="orb-container" id="orb-container">
        <button class="orb-btn" id="orb-btn">
          <svg id="orb-svg" width="372" height="372" viewBox="-186 -186 372 372"></svg>
        </button>
      </div>


      <!-- Timer -->
      <div class="timer-container">
        <div class="timer">
          <span id="timer-mm">00</span>
          <span class="timer-colon">:</span>
          <span id="timer-ss">00</span>
        </div>
        <div class="timer-progress">
          <div class="timer-track"></div>
          <div class="timer-fill" id="timer-fill"></div>
          <div class="timer-dot" id="timer-dot"></div>
        </div>
        <div class="timer-labels">
          <span>0:00</span><span>5:00</span><span>10:00</span>
        </div>
      </div>
    </div>

    <!-- ═══ Screen: Settings ═══ -->
    <div class="screen-settings hidden" id="screen-settings">
      <!-- Header -->
      <div class="settings-header">
        <div class="settings-title-row">
          <span style="font-family: var(--mono); font-size: 10.5px; letter-spacing: 2px; color: var(--inkSoft); text-transform: uppercase;">Ajustes</span>
          <button class="settings-close-btn" id="btn-settings-close">cerrar ✕</button>
        </div>
        <h2 class="settings-subtitle">Elige una <span style="font-style: italic;">voz</span></h2>
      </div>

      <!-- Section label -->
      <div class="settings-section-label">
        <span>Mundo hispanohablante</span>
        <span id="voice-counter">01 / 44</span>
      </div>

      <!-- Voices map -->
      <svg id="voices-map" viewBox="0 0 360 290" width="100%" height="290" style="position: absolute; top: 212px; left: 0; right: 0; overflow: visible; display: block; padding: 0 16px; max-width: 402px;"></svg>

      <!-- Selected voice card -->
      <div class="settings-selected-voice">
        <div class="selected-voice-name" id="selected-voice-name">Elvira</div>
        <div class="selected-voice-city" id="selected-voice-city">Madrid</div>
        <div class="selected-voice-meta" id="selected-voice-meta">España · paciente</div>
      </div>

      <!-- Duration section -->
      <div class="settings-duration">
        <div class="duration-label">
          <span class="duration-label-text">Duración</span>
          <div>
            <span class="duration-value" id="duration-value">10</span>
            <span class="duration-min">min</span>
          </div>
        </div>
        <div class="duration-slider-container">
          <div class="duration-track"></div>
          <div class="duration-fill" id="duration-fill"></div>
          <input type="range" min="5" max="15" value="10" class="duration-slider" id="duration-slider">
          <div class="duration-thumb" id="duration-thumb"></div>
        </div>
        <div class="duration-labels">
          <span>5 MIN</span><span>10</span><span>15 MIN</span>
        </div>
      </div>

      <!-- Save button -->
      <button class="settings-save" id="btn-save">Guardar</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ──────────────────────────────────────────────────────────────
// Configuration
// ──────────────────────────────────────────────────────────────
const GROQ_STT   = 'https://api.groq.com/openai/v1/audio/transcriptions';
const GROQ_CHAT  = 'https://api.groq.com/openai/v1/chat/completions';
const GROQ_MODEL = 'llama-3.3-70b-versatile';
const HIST_MAX   = 10;

const SYSTEM = `Eres un hablante nativo de español muy amigable y conversacional.

// ═══ CONVERSATION MANAGER - Continuous Listening & Response ════
// ══════════════════════════════════════════════════════════════

class ConversationManager {
  constructor() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    this.recognition = SpeechRecognition ? new SpeechRecognition() : null;

    // State tracking
    this.isListening = false;
    this.isAISpeaking = false;
    this.responseInProgress = false;
    this.lastSpeechTime = 0;
    this.silenceTimeout = null;
    this.conversationHistory = [];
    this.allTranscript = ''; // All speech accumulated so far
    this.lastFinalTranscript = ''; // Last completed sentence

    if (this.recognition) {
      this.recognition.continuous = true;
      this.recognition.interimResults = true;
      this.recognition.lang = 'es-ES';
      this.setupListeners();
    }
  }

  setupListeners() {
    this.recognition.onstart = () => {
      console.log('[Conv] 🎤 Listening started');
      this.isListening = true;
    };

    this.recognition.onend = () => {
      console.log('[Conv] 🎤 Listening ended');
      this.isListening = false;
      if (this.silenceTimeout) clearTimeout(this.silenceTimeout);
    };

    this.recognition.onresult = (event) => {
      console.log('[Conv] onresult event - isFinal:', event.results[event.results.length - 1]?.isFinal);

      let finalText = '';
      let interimText = '';

      // Collect all results
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        console.log(`  Result ${i}: "${transcript}" (final: ${event.results[i].isFinal})`);

        if (event.results[i].isFinal) {
          finalText += transcript + ' ';
        } else {
          interimText += transcript + ' ';
        }
      }

      // Update accumulated transcript
      if (finalText) {
        this.lastFinalTranscript = finalText.trim();
        this.allTranscript += finalText;
      }

      const currentSpeech = (this.allTranscript + interimText).trim();
      console.log('[Conv] Current speech:', currentSpeech);

      // Reset silence timer - user is speaking
      this.lastSpeechTime = Date.now();
      if (this.silenceTimeout) clearTimeout(this.silenceTimeout);

      // Set new silence timer: 1 second of no new speech
      this.silenceTimeout = setTimeout(() => {
        console.log('[Conv] ⏱️ Silence detected (1s) - checking if should respond');
        this.onSilenceDetected(currentSpeech);
      }, 1000);
    };

    this.recognition.onerror = (event) => {
      console.error('[Conv] Recognition error:', event.error);
    };
  }

  // Called when user has been silent for 1 second
  async onSilenceDetected(transcript) {
    if (!transcript.trim()) return;
    if (this.responseInProgress) return;
    if (this.isAISpeaking) return;

    console.log('[Conv] 📝 Analyzing:', transcript);

    // Check if we should respond
    const shouldRespond = this.checkConditionsDirectly(transcript);
    console.log('[Conv] Should respond (direct check):', shouldRespond);

    if (shouldRespond) {
      console.log('[Conv] ✅ Responding!');
      await this.generateAndPlayResponse(transcript);
    } else {
      console.log('[Conv] ❌ No response needed, continue listening');
    }
  }

  // Direct condition checks without LLM call
  checkConditionsDirectly(transcript) {
    if (!transcript.trim()) return false;

    const lower = transcript.toLowerCase();

    // Check 1: Questions (starts with ¿ or ends with ?)
    if (transcript.includes('¿') || transcript.includes('?')) {
      console.log('[Conv] ✓ Detected question');
      return true;
    }

    // Check 2: Hesitations/filled pauses
    if (/\b(um|uh|eh|hmm|eee|mmm|bueno|pues|bueno pues)\b/i.test(transcript)) {
      console.log('[Conv] ✓ Detected hesitation');
      return true;
    }

    // Check 3: Obvious grammar errors (basic patterns)
    if (this.detectBasicErrors(lower)) {
      console.log('[Conv] ✓ Detected grammar error');
      return true;
    }

    // Check 4: Statement with period (completed thought)
    if (transcript.includes('.') || transcript.includes('!')) {
      console.log('[Conv] ✓ Detected completed sentence');
      return true;
    }

    return false;
  }

  // Simple error detection without ML
  detectBasicErrors(text) {
    // Common Spanish errors
    const errorPatterns = [
      /\byo soy/i,  // Usually "soy" alone, not "yo soy"
      /\bes un/i,   // "es un" before feminine
      /\bla [^aeiou]/i, // la before consonant (feminine before masculine)
      /\bel [aeiou]/i,  // el before vowel (masculine before vowel)
      /\bde la de/i, // Double articles
    ];
    return errorPatterns.some(pattern => pattern.test(text));
  }

  async generateAndPlayResponse(userMessage) {
    if (this.responseInProgress || this.isAISpeaking) return;
    this.responseInProgress = true;

    try {
      console.log('[Conv] 🤖 Generating response...');

      const systemPrompt = `Eres un profesor de español muy amigable.
El usuario acaba de decir: "${userMessage}"

IMPORTANTE: Responde en MÁXIMO 1-2 frases CORTAS.
- Si hay error de idioma, corrígelo sutilmente
- Se natural y conversacional
- Sé breve

Responde solo la réplica, sin explicaciones.`;

      const messages = [
        { role: 'system', content: systemPrompt },
        ...this.conversationHistory.slice(-4),
        { role: 'user', content: userMessage }
      ];

      const response = await this.callLLM('', { messages, max_tokens: 50, temperature: 0.7 });
      console.log('[Conv] 📢 Response generated:', response);

      // === CRITICAL: Switch to hablando state BEFORE stopping recognition ===
      console.log('[Conv] 🔴 Setting state to HABLANDO (waves should appear)');
      setState('hablando');

      // Stop recognition while speaking
      if (this.recognition && this.isListening) {
        console.log('[Conv] ⏹️ Stopping recognition');
        this.recognition.stop();
      }

      // Play the response
      console.log('[Conv] 🔊 Speaking response');
      await speak(response);
      console.log('[Conv] ✅ Finished speaking');

      // Add to conversation history
      this.conversationHistory.push({ role: 'user', content: userMessage });
      this.conversationHistory.push({ role: 'assistant', content: response });
      if (this.conversationHistory.length > 20) {
        this.conversationHistory = this.conversationHistory.slice(-20);
      }

      // Reset transcript for next cycle
      this.allTranscript = '';

      // === CRITICAL: Resume listening ===
      console.log('[Conv] 🟢 Setting state back to EN VIVO');
      setState('en vivo');

      if (this.recognition) {
        console.log('[Conv] 🎤 Restarting recognition');
        setTimeout(() => this.recognition.start(), 100); // Brief delay before restarting
      }
    } catch (e) {
      console.error('[Conv] ❌ Response generation failed:', e);
    } finally {
      this.isAISpeaking = false;
      this.responseInProgress = false;
    }
  }

  async callLLM(userPrompt, options = {}) {
    const messages = options.messages || [{ role: 'user', content: userPrompt }];

    const response = await fetch(GROQ_CHAT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${getGroqKey()}`
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: messages,
        max_tokens: options.max_tokens || 100,
        temperature: options.temperature || 0.7
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `LLM API failed: ${response.status}`);
    }

    const data = await response.json();
    const content = data.choices[0]?.message?.content;
    if (!content) throw new Error('No response content from LLM');
    return content;
  }

  start() {
    console.log('[Conv] ▶️ Starting conversation manager');
    if (this.recognition && !this.isListening) {
      this.allTranscript = '';
      this.lastFinalTranscript = '';
      this.recognition.start();
    }
  }

  stop() {
    console.log('[Conv] ⏹️ Stopping conversation manager');
    if (this.silenceTimeout) clearTimeout(this.silenceTimeout);
    if (this.recognition && this.isListening) {
      this.recognition.stop();
    }
  }
}

// ──────────────────────────────────────────────────────────────
// AudioAnalyzer: Real-time audio analysis for triggers
// ──────────────────────────────────────────────────────────────
class AudioAnalyzer {
  constructor(audioContext, sampleRate = 16000) {
    this.audioContext = audioContext;
    this.sampleRate = sampleRate;
    this.minPauseDuration = 0.8; // seconds (reduced from 1.5 for more aggressive detection)
    this.maxPauseDuration = 3.0; // seconds (increased window)
    this.silenceThreshold = -35; // dB (lowered from -40 to detect softer pauses)
    this.listeners = [];
  }

  on(event, callback) {
    this.listeners.push({ event, callback });
  }

  emit(event, data) {
    this.listeners
      .filter(l => l.event === event)
      .forEach(l => l.callback(data));
  }

  analyzePause(audioBuffer, isUserSpeaking) {
    if (!isUserSpeaking) return null;

    const samples = audioBuffer.getChannelData(0);
    let sumSquares = 0;
    for (let i = 0; i < samples.length; i++) {
      sumSquares += samples[i] * samples[i];
    }
    const rms = Math.sqrt(sumSquares / samples.length);
    const db = rms > 0 ? 20 * Math.log10(rms) : -Infinity;

    if (db < this.silenceThreshold) {
      const duration = audioBuffer.duration;
      if (duration >= this.minPauseDuration && duration <= this.maxPauseDuration) {
        return {
          type: 'pause',
          duration: duration,
          intensity: Math.abs(db)
        };
      }
    }
    return null;
  }

  analyzeHesitation(audioBuffer) {
    const samples = audioBuffer.getChannelData(0);
    const duration = audioBuffer.duration;
    const avgEnergy = this._calculateAverageEnergy(samples);

    if (duration >= 0.2 && duration <= 1.2 && avgEnergy > this.silenceThreshold + 3) {
      return {
        type: 'hesitation',
        duration: duration,
        confidence: 0.8 // Increased confidence
      };
    }
    return null;
  }

  analyzeKeywords(transcript) {
    if (!transcript || transcript.length === 0) return null;

    const lowerTranscript = transcript.toLowerCase();
    const questionPatterns = [
      '¿cuándo', '¿por qué', '¿cómo', '¿qué', '¿dónde',
      '¿cuál', '¿quién', '¿cuánto'
    ];
    const markerPatterns = [
      'pero', 'entonces', 'por eso', 'sin embargo',
      'además', 'claro', 'verdad'
    ];

    for (const pattern of questionPatterns) {
      if (lowerTranscript.includes(pattern)) {
        return {
          type: 'keyword',
          subtype: 'question',
          pattern: pattern,
          confidence: 0.9
        };
      }
    }

    for (const pattern of markerPatterns) {
      if (lowerTranscript.includes(pattern)) {
        return {
          type: 'keyword',
          subtype: 'marker',
          pattern: pattern,
          confidence: 0.7
        };
      }
    }

    return null;
  }

  analyzeContext(transcript, audioBuffer) {
    if (!transcript || !audioBuffer) return null;

    const hasSentenceEnd = /[.!?]$/.test(transcript.trim());
    const hasExclamation = transcript.includes('!') || transcript.includes('¡');
    const continuationMarkers = [
      'porque', 'cuando', 'si', 'aunque',
      'mientras', 'después', 'antes'
    ];
    const lowerTranscript = transcript.toLowerCase();
    const hasContinuationMarker = continuationMarkers.some(m =>
      lowerTranscript.includes(m)
    );

    if (hasSentenceEnd || hasExclamation || hasContinuationMarker) {
      return {
        type: 'context',
        subtype: hasSentenceEnd ? 'sentence_end' :
                 hasExclamation ? 'emotional' : 'continuation',
        confidence: 0.6
      };
    }

    return null;
  }

  detectTrigger(audioBuffer, transcript, isUserSpeaking) {
    const pause = this.analyzePause(audioBuffer, isUserSpeaking);
    if (pause) return pause;

    const hesitation = this.analyzeHesitation(audioBuffer);
    if (hesitation) return hesitation;

    const keyword = this.analyzeKeywords(transcript);
    if (keyword) return keyword;

    const context = this.analyzeContext(transcript, audioBuffer);
    if (context) return context;

    return null;
  }

  _calculateAverageEnergy(samples) {
    let sum = 0;
    for (let i = 0; i < samples.length; i++) {
      sum += Math.abs(samples[i]);
    }
    return 20 * Math.log10(sum / samples.length + 1e-10);
  }
}

// ──────────────────────────────────────────────────────────────
// CooldownManager: Escalating cooldown state machine
// ──────────────────────────────────────────────────────────────
class CooldownManager {
  constructor() {
    this.state = 'off'; // 'off', '30s', '2min'
    this.cooldownTimer = null;
    this.cooldownEndTime = null;
    this.cooldownDuration = 0;

    this.triggerPhrases = [
      'déjame hablar', 'dejame hablar', 'no me interrumpas',
      'dame un momento', 'dame un segundo', 'silencio', 'calla', 'para', 'espera'
    ];

    this.resumePhrases = [
      'puedo hablar de nuevo', 'vuelve', 'adelante', 'continúa'
    ];
  }

  isActive() {
    if (this.state === 'off') return false;

    if (this.cooldownEndTime && Date.now() >= this.cooldownEndTime) {
      this.state = 'off';
      return false;
    }

    return true;
  }

  checkTranscript(transcript) {
    if (!transcript) return null;

    const lowerTranscript = transcript.toLowerCase();

    for (const phrase of this.triggerPhrases) {
      if (lowerTranscript.includes(phrase)) {
        return { action: 'activate', phrase };
      }
    }

    for (const phrase of this.resumePhrases) {
      if (lowerTranscript.includes(phrase)) {
        return { action: 'resume', phrase };
      }
    }

    return null;
  }

  activate() {
    if (this.state === 'off') {
      this.state = '30s';
      this.cooldownDuration = 30000; // 30 seconds
    } else if (this.state === '30s') {
      this.state = '2min';
      this.cooldownDuration = 120000; // 2 minutes
    } else if (this.state === '2min') {
      this.cooldownDuration = 120000;
    }

    this.cooldownEndTime = Date.now() + this.cooldownDuration;
    return this.state;
  }

  resume() {
    if (this.cooldownTimer) {
      clearTimeout(this.cooldownTimer);
    }
    this.state = 'off';
    this.cooldownEndTime = null;
    this.cooldownDuration = 0;
  }

  getState() {
    return {
      active: this.isActive(),
      state: this.state,
      remainingSeconds: this._getRemainingSeconds()
    };
  }

  _getRemainingSeconds() {
    if (!this.cooldownEndTime) return 0;
    const remaining = Math.max(0, this.cooldownEndTime - Date.now());
    return Math.ceil(remaining / 1000);
  }
}

// ──────────────────────────────────────────────────────────────
// InterjectManager: Main orchestrator
// ──────────────────────────────────────────────────────────────
class InterjectManager {
  constructor(audioContext, options = {}) {
    this.audioContext = audioContext;
    this.audioAnalyzer = new AudioAnalyzer(audioContext);
    this.cooldownManager = new CooldownManager();

    this.isRecording = false;
    this.isPlayingInterject = false;
    this.currentAudioBuffer = null;
    this.recentTranscript = null;
    this.currentPlayingAudio = null;
    this.interjectionHistory = [];
    this.conversationContext = [];

    this.config = {
      minFrequencyPerSession: 2,
      maxFrequencyPerSession: 8, // Increased from 5 to 8 for more aggressive interjections
      maxInterjectLength: 150,
      maxInterjectDuration: 15,
      llmValidationTimeout: 3000,
      ...options
    };

    this.sessionInterjectionCount = 0;
  }

  startAnalysis() {
    this.isRecording = true;
    this.sessionInterjectionCount = 0;
  }

  stopAnalysis() {
    this.isRecording = false;
    this.currentAudioBuffer = null;
  }

  updateTranscript(chunk) {
    this.recentTranscript = chunk;
  }

  async analyzeBuffer(audioBuffer) {
    if (!this.isRecording || this.isPlayingInterject || this.cooldownManager.isActive()) {
      return null;
    }

    const trigger = this.audioAnalyzer.detectTrigger(
      audioBuffer,
      this.recentTranscript,
      true
    );

    if (!trigger) return null;

    return this.requestInterjection(trigger);
  }

  async requestInterjection(trigger) {
    if (this.sessionInterjectionCount >= this.config.maxFrequencyPerSession) {
      return null;
    }

    try {
      const prompt = this._buildValidationPrompt(trigger);
      const response = await this._callLLM(prompt, {
        temperature: 0.7,
        max_tokens: 50
      });

      const { shouldInterject } = this._parseValidationResponse(response);

      if (shouldInterject) {
        return await this.generateInterject(trigger);
      }
    } catch (error) {
      console.error('[Interject] LLM validation failed:', error);
    }

    return null;
  }

  async generateInterject(trigger) {
    try {
      const prompt = this._buildGenerationPrompt(trigger);
      const text = await this._callLLM(prompt, {
        temperature: 0.8,
        max_tokens: 60
      });

      const words = text.split(/\s+/).length;
      const finalText = words > this.config.maxInterjectLength
        ? this._truncateInterject(text, this.config.maxInterjectLength)
        : text.trim();

      return {
        text: finalText,
        type: this._classifyInterject(finalText),
        trigger: trigger.type
      };
    } catch (error) {
      console.error('[Interject] Generation failed:', error);
      return null;
    }
  }

  async playInterject(interjectData) {
    if (!interjectData || !interjectData.text) return false;

    this.isPlayingInterject = true;

    try {
      const audioBlob = await this._getTTSAudio(interjectData.text);
      const audio = new Audio(URL.createObjectURL(audioBlob));
      audio.volume = 0.8;

      this.currentPlayingAudio = audio;
      this._emitEvent('interject:start', { text: interjectData.text });

      await new Promise((resolve) => {
        audio.addEventListener('ended', () => {
          this.currentPlayingAudio = null;
          this._emitEvent('interject:end', {});
          resolve();
        }, { once: true });

        audio.play().catch(err => {
          console.error('[Interject] Playback failed:', err);
          this.currentPlayingAudio = null;
          resolve();
        });
      });

      this.storeInterject(interjectData.text, interjectData.type);
      this.sessionInterjectionCount++;

      return true;
    } catch (error) {
      console.error('[Interject] Playback error:', error);
      return false;
    } finally {
      this.isPlayingInterject = false;
    }
  }

  interruptCurrentInterject() {
    if (this.currentPlayingAudio) {
      this.currentPlayingAudio.pause();
      this.currentPlayingAudio.currentTime = 0;
      this.currentPlayingAudio = null;

      this._emitEvent('interject:interrupted', {});
      return true;
    }
    return false;
  }

  storeInterject(text, type) {
    const interject = {
      timestamp: Date.now(),
      text: text,
      type: type
    };
    this.interjectionHistory.push(interject);
    return interject;
  }

  getInterjectionContext() {
    return this.interjectionHistory
      .map(i => ({
        role: 'assistant',
        type: 'interject',
        content: i.text
      }))
      .slice(-3);
  }

  processCooldownCommand(transcript) {
    const result = this.cooldownManager.checkTranscript(transcript);
    if (!result) return;

    if (result.action === 'activate') {
      const newState = this.cooldownManager.activate();
      console.log(`[Interject] Cooldown activated: ${newState}`);
    } else if (result.action === 'resume') {
      this.cooldownManager.resume();
      console.log('[Interject] Cooldown resumed');
    }
  }

  async detectAndCorrectErrors(transcript) {
    if (!transcript || transcript.length < 3) return null;
    if (this.cooldownManager.isActive()) return null;
    if (this.sessionInterjectionCount >= this.config.maxFrequencyPerSession) return null;

    try {
      const prompt = this._buildErrorDetectionPrompt(transcript);
      const response = await this._callLLM(prompt, {
        temperature: 0.3, // Lower temp for more consistent corrections
        max_tokens: 40
      });

      const correction = response.trim();

      // If no error detected, return null
      if (correction.includes('PERFECT') || correction.toUpperCase() === 'PERFECT') {
        return null;
      }

      // Otherwise, we have a correction to make
      return {
        text: correction,
        type: 'correction',
        trigger: 'error_detected'
      };
    } catch (error) {
      console.error('[Interject] Error detection failed:', error);
      return null;
    }
  }

  addConversationTurn(userText, assistantResponse) {
    this.conversationContext.push({
      user: userText,
      assistant: assistantResponse,
      interjections: [...this.interjectionHistory.slice(-1)]
    });

    if (this.conversationContext.length > 5) {
      this.conversationContext.shift();
    }
  }

  getFullResponseSystemPrompt() {
    const recentInterjections = this.interjectionHistory
      .slice(-2)
      .map(i => i.text)
      .join('; ');

    if (recentInterjections.length === 0) {
      return SYSTEM;
    }

    return SYSTEM + `\n\nNota: Acabas de hacer estas interjecciones: "${recentInterjections}". En tu respuesta, evita repetir estos puntos. Expándelos o reconócelos naturalmente.`;
  }

  resetSession() {
    this.sessionInterjectionCount = 0;
    this.interjectionHistory = [];
    this.cooldownManager.resume();
  }

  // Private helpers
  _buildValidationPrompt(trigger) {
    const context = this.conversationContext
      .slice(-2)
      .map(ex => `User: ${ex.user}\nAssistant: ${ex.assistant}`)
      .join('\n');

    return `You are a Spanish conversation partner.

User is currently speaking. Context:
${context}

Current moment: User ${trigger.type} ${trigger.subtype ? `(${trigger.subtype})` : ''}.
Recent: "${this.recentTranscript}"

Should you interject now with a short follow-up comment? Answer only: YES or NO.`;
  }

  _buildErrorDetectionPrompt(transcript) {
    return `You are a Spanish grammar teacher analyzing a student's speech in real-time.

Student just said: "${transcript}"

Analyze for grammar, spelling, or language errors. If there are errors, you MUST correct them with a short (1-2 sentence) natural correction. If perfect, respond with PERFECT.

Respond ONLY with either:
- The correction (in Spanish, 1-2 sentences max)
- Or the word: PERFECT

No explanation, just the correction or PERFECT.`;
  }

  _buildGenerationPrompt(trigger) {
    return `You are a Spanish conversation partner having a natural conversation.

User just ${trigger.type === 'pause' ? 'paused' : trigger.type}.

Generate a SHORT (1-3 sentences) natural interject that:
- Shows you understand what they're saying
- Validates or adds relevant information
- Feels like a real interruption in conversation

Write ONLY the interject, in Spanish, no explanation.`;
  }

  _parseValidationResponse(response) {
    const text = response.toLowerCase();
    const shouldInterject = text.includes('yes') || text.includes('sí');
    return { shouldInterject };
  }

  _classifyInterject(text) {
    const lower = text.toLowerCase();

    if (/^(sí|exacto|claro|verdad|correcto|tienes razón)/.test(lower)) {
      return 'confirmatory';
    }

    if (text.includes('?')) {
      return 'question';
    }

    if (/^(pero|aunque|sin embargo|realmente)/.test(lower)) {
      return 'new_angle';
    }

    return 'confirmatory';
  }

  _truncateInterject(text, maxWords) {
    const words = text.split(/\s+/);
    if (words.length <= maxWords) return text;

    const truncated = words.slice(0, maxWords).join(' ');
    const lastPeriod = truncated.lastIndexOf('.');
    const lastComma = truncated.lastIndexOf(',');
    const breakPoint = Math.max(lastPeriod, lastComma);

    if (breakPoint > maxWords * 0.7) {
      return truncated.substring(0, breakPoint + 1);
    }

    return truncated + '...';
  }

  async _callLLM(prompt, options = {}) {
    const response = await fetch(GROQ_CHAT, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${DEFAULT_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: [{ role: 'user', content: prompt }],
        temperature: options.temperature || 0.7,
        max_tokens: options.max_tokens || 100
      })
    });

    if (!response.ok) throw new Error('LLM API failed');

    const data = await response.json();
    return data.choices[0].message.content;
  }

  async _getTTSAudio(text) {
    const voice = ONDAS_VOICES[currentVoiceIdx].id;

    const response = await fetch(`/api/tts?text=${encodeURIComponent(text)}&voice=${encodeURIComponent(voice)}`);

    if (!response.ok) throw new Error('TTS API failed');

    return response.blob();
  }

  _emitEvent(eventName, data) {
    if (typeof window !== 'undefined' && window.dispatchEvent) {
      const event = new CustomEvent(`interject:${eventName}`, { detail: data });
      window.dispatchEvent(event);
    }
  }

  on(eventName, callback) {
    if (typeof window !== 'undefined') {
      window.addEventListener(`interject:${eventName}`, (e) => {
        callback(e.detail);
      });
    }
  }
}

function splitText(text, max = 180) {
  const parts = text.match(/[^.!?]+[.!?]*/g) || [text];
  const chunks = [];
  let cur = '';
  for (const p of parts) {
    if (cur.length + p.length > max && cur) { chunks.push(cur.trim()); cur = p; }
    else cur += p;
  }
  if (cur.trim()) chunks.push(cur.trim());
  return chunks;
}

async function unlockAudio() {

// TTS (espagnol-tts API)
// ──────────────────────────────────────────────────────────────

async function speakChunk(text) {
  try {
    const voice = getVoiceKey();
    const r = await fetch(`/api/tts?text=${encodeURIComponent(text)}&voice=${encodeURIComponent(voice)}`);
    if (!r.ok) throw new Error(`TTS fetch ${r.status}`);

    const arrayBuf = await r.arrayBuffer();
    const decoded = await audioCtx.decodeAudioData(arrayBuf);

    const src = audioCtx.createBufferSource();
    src.buffer = decoded;
    src.connect(audioCtx.destination);

    return new Promise((resolve, reject) => {
      src.onended = () => resolve();
      src.onerror = e => reject(e);
      src.start(0);
    });
  } catch (e) {
    console.error('[TTS] Error:', e.message);
    throw e;
  }
}

async function speak(text) {
  try {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }

    for (const chunk of splitText(text)) {
      await speakChunk(chunk);
    }
  } catch (e) {
    console.error('[TTS] speak() error:', e.message);
    throw e;
  }
}

// ──────────────────────────────────────────────────────────────
// STT
// ──────────────────────────────────────────────────────────────

function initMime() {
  for (const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']) {
    if (MediaRecorder.isTypeSupported(t)) { mimeType = t; return; }
  }
}

async function startRec() {
  console.log('🎙️ [RECORD] Starting recording...');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    recorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = onStop;
    recorder.start();
    console.log('🎙️ [RECORD] Recording started, state set to listening');
    setState('listening');

    // Start interject analysis
    if (interjectManager) {
      interjectManager.startAnalysis();
      interjectManager.resetSession();

      // Create audio analyzer for real-time interject detection
      const source = audioCtx.createMediaStreamAudioSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);

      // Periodic check for interjections: error detection + pauses
      let lastChunkCount = 0;
      let silenceCounter = 0;
      let lastTranscriptCheck = '';
      let lastErrorCheckTime = 0;

      console.log('[Interject] Starting periodic check loop');

      const interjectCheckInterval = setInterval(async () => {
        if (appState !== 'listening') {
          console.log('[Interject] State changed to', appState, '- clearing interval');
          clearInterval(interjectCheckInterval);
          return;
        }

        try {
          // Strategy 1: Check for grammar/language errors in interim transcript
          const now = Date.now();
          if (now - lastErrorCheckTime > 2000 && chunks.length > 0) { // Check every 2 seconds
            lastErrorCheckTime = now;
            console.log('[Interject] Checking for errors - chunks:', chunks.length);

            try {
              // Get interim transcription from accumulated chunks
              const mimeType = recorder.mimeType || 'audio/webm';
              const interimBlob = new Blob(chunks, { type: mimeType });
              console.log('[Interject] Interim blob size:', interimBlob.size);

              if (interimBlob.size > 10000) { // Only if we have enough audio
                console.log('[Interject] Requesting interim STT...');
                const interimTranscript = await stt(interimBlob, mimeType);
                console.log('[Interject] Interim transcript:', interimTranscript);

                // Only check significant changes to avoid redundant checks
                if (interimTranscript && interimTranscript !== lastTranscriptCheck && interimTranscript.length > 10) {
                  lastTranscriptCheck = interimTranscript;
                  console.log('[Interject] New transcript detected, checking for errors...');

                  // Check for errors in this transcript
                  const correction = await interjectManager.detectAndCorrectErrors(interimTranscript);
                  console.log('[Interject] Error detection result:', correction);

                  if (correction) {
                    // ERROR DETECTED - interrupt immediately
                    console.log('[Interject] ERROR FOUND - interrupting!');
                    if (recorder && recorder.state === 'recording') {
                      recorder.pause();
                    }

                    // Play correction
                    setState('speaking');
                    setSub('');
                    await interjectManager.playInterject(correction);

                    // Resume recording
                    if (recorder && recorder.state === 'paused') {
                      recorder.resume();
                    }
                    setState('listening');
                    lastTranscriptCheck = ''; // Reset to allow future checks
                    return;
                  }
                }
              } else {
                console.log('[Interject] Blob too small:', interimBlob.size, 'need > 10000');
              }
            } catch (err) {
              console.error('[Interject] Interim transcription failed:', err);
            }
          }

          // Strategy 2: Detect pauses (fallback for other interjections)
          if (chunks.length === lastChunkCount) {
            silenceCounter++;
          } else {
            silenceCounter = 0;
            lastChunkCount = chunks.length;
          }

          // Pause detected (3+ checks = ~1.5s silence)
          if (silenceCounter >= 3) {
            const interjectData = await interjectManager.requestInterjection({
              type: 'pause',
              subtype: 'detected',
              confidence: 0.7
            });

            if (interjectData) {
              if (recorder && recorder.state === 'recording') {
                recorder.pause();
              }

              setState('speaking');
              setSub('');
              await interjectManager.playInterject(interjectData);

              if (recorder && recorder.state === 'paused') {
                recorder.resume();
              }
              setState('listening');
              silenceCounter = 0;
            }
          }
        } catch (err) {
          console.error('[Interject] Check failed:', err);
        }
      }, 500); // Check every 500ms

      // Store interval for cleanup
      window.interjectCheckInterval = interjectCheckInterval;
    }
  } catch (e) {
    setSub(`⚠️ Micrófono: ${e.message}`);
    setState('idle');
  }
}

function stopRec() {
  if (!recorder || recorder.state === 'inactive') return;

  // Clear interject check interval
  if (window.interjectCheckInterval) {
    clearInterval(window.interjectCheckInterval);
    window.interjectCheckInterval = null;
  }

  recorder.stop();
  recorder.stream.getTracks().forEach(t => t.stop());
}

async function stt(blob, type) {
  const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
  const fd = new FormData();
  fd.append('file', blob, `rec.${ext}`);
  fd.append('model', 'whisper-large-v3');
  fd.append('language', 'es');
  fd.append('response_format', 'json');
  const r = await fetch(GROQ_STT, {
    method: 'POST',
    headers: { Authorization: `Bearer ${getGroqKey()}` },
    body: fd,
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error?.message || `STT ${r.status}`); }
  return (await r.json()).text || '';
}

// LLM
// ──────────────────────────────────────────────────────────────

function getGroqKey() {
  return localStorage.getItem('groq_key') || DEFAULT_KEY;
}

async function llm() {
  // Use enhanced system prompt if interject manager is available
  const systemPrompt = interjectManager
    ? interjectManager.getFullResponseSystemPrompt()
    : SYSTEM;

  const r = await fetch(GROQ_CHAT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getGroqKey()}` },
    body: JSON.stringify({
      model: GROQ_MODEL,
      max_tokens: 200,
      messages: [{ role: 'system', content: systemPrompt }, ...history],
    }),
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error?.message || `LLM ${r.status}`); }
  return (await r.json()).choices[0]?.message?.content || '';
}

// ──────────────────────────────────────────────────────────────
// Pipeline
// ──────────────────────────────────────────────────────────────

async function onStop() {
  if (!chunks.length) { setState('idle'); return; }
  const type = recorder.mimeType || mimeType || 'audio/webm';
  const blob = new Blob(chunks, { type });

  // Start session countdown on first input
  if (!chronoInterval) {
    chronoStart(parseInt(localStorage.getItem('session_duration') || '10', 10));
  }

  setState('thinking');
  setSub('');

  try {
    const transcript = await stt(blob, type);
    if (!transcript.trim()) { setState('idle'); setSub('(sin captar)'); return; }
    setSub(`« ${transcript} »`);

    // Update interject manager
    if (interjectManager) {
      interjectManager.updateTranscript(transcript);
      interjectManager.processCooldownCommand(transcript);
    }

    history.push({ role: 'user', content: transcript });
    if (history.length > HIST_MAX * 2) history = history.slice(-HIST_MAX * 2);

    const reply = await llm();
    history.push({ role: 'assistant', content: reply });
    if (history.length > HIST_MAX * 2) history = history.slice(-HIST_MAX * 2);

    // Track conversation in interject manager
    if (interjectManager) {
      interjectManager.addConversationTurn(transcript, reply);
    }

    setState('speaking');
    setPrompt(reply);
    await speak(reply);

  } catch (e) {
    setSub(`⚠️ ${e.message}`);
  } finally {
    setState('idle');
  }
}

// ──────────────────────────────────────────────────────────────
// Chrono (Session countdown)
// ──────────────────────────────────────────────────────────────

function chronoTick() {
  chronoSeconds--;
  if (chronoSeconds <= 0) {
    chronoSeconds = 0;
    clearInterval(chronoInterval);
    chronoInterval = null;
    setSub('⏱️ Sesión terminada · Siguiente sesión disponible');
    setState('idle');
    timerMm.textContent = '00';
    timerSs.textContent = '00';
    timerFill.style.width = '0%';
    timerDot.style.left = 'calc(0% - 7px)';
    return;
  }
  const mm = String(Math.floor(chronoSeconds / 60)).padStart(2, '0');
  const ss = String(chronoSeconds % 60).padStart(2, '0');
  timerMm.textContent = mm;
  timerSs.textContent = ss;

  // Progress bar: starts full (100%) and counts down to empty (0%)
  const remainingPct = (chronoSeconds / (sessionDuration * 60)) * 100;
  timerFill.style.width = remainingPct + '%';
  timerDot.style.left = `calc(${remainingPct}% - 7px)`;
}

function chronoStart(durationMinutes) {
  if (chronoInterval) return;
  sessionDuration = durationMinutes;
  chronoSeconds = durationMinutes * 60;
  const mm = String(Math.floor(chronoSeconds / 60)).padStart(2, '0');
  const ss = String(chronoSeconds % 60).padStart(2, '0');
  timerMm.textContent = mm;
  timerSs.textContent = ss;
  // Initialize progress bar at full
  timerFill.style.width = '100%';
  timerDot.style.left = 'calc(100% - 7px)';
  console.log(`[Session] Starting ${durationMinutes}min countdown`);
  chronoInterval = setInterval(chronoTick, 1000);
}

function chronoStop() {
  clearInterval(chronoInterval);
  chronoInterval = null;
  chronoSeconds = 0;
  timerMm.textContent = '00';
  timerSs.textContent = '00';
}

// ──────────────────────────────────────────────────────────────
// Ondas Orb SVG rendering
// ──────────────────────────────────────────────────────────────

function renderOrb() {
  const size = 372;
  const ext = size / 2;
  const voice = ONDAS_VOICES[currentVoiceIdx];
  const hsl = `hsl(${voice.hue}, 60%, 72%)`;
  const hslDeep = `hsl(${voice.hue}, 55%, 50%)`;
  // Show waves when listening OR when AI is speaking
  const listening = appState === 'en vivo' || appState === 'hablando';

  const rOuter = ext * 0.86;
  const rInner = ext * 0.72;
  const rOrb = ext * 0.46;
  const rWave = ext * 0.52;
  const waveAmp = (listening ? size * 0.05 : size * 0.014) * 1;

  let svg = `<defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${hsl}" stop-opacity="${0.32 * 1}"/>
      <stop offset="55%" stop-color="${hsl}" stop-opacity="${0.10 * 1}"/>
      <stop offset="100%" stop-color="${hsl}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="40%" cy="35%">
      <stop offset="0%" stop-color="${listening ? '#FFE4D5' : '#E8DCFA'}" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="${hsl}" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="${hslDeep}" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="${hslDeep}" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="orbglow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="${hsl}" stop-opacity="${0.55 * 1}"/>
      <stop offset="60%" stop-color="${hsl}" stop-opacity="${0.15 * 1}"/>
      <stop offset="100%" stop-color="${hsl}" stop-opacity="0"/>
    </radialGradient>
  </defs>`;

  // Halo
  svg += `<circle cx="0" cy="0" r="${ext * 1.0}" fill="url(#halo)"/>`;

  // Rings
  svg += `<circle cx="0" cy="0" r="${rOuter}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5" stroke-dasharray="1.5 6" />`;
  svg += `<circle cx="0" cy="0" r="${rInner}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5" />`;

  // Particles
  const pCount = 35;
  for (let i = 0; i < pCount; i++) {
    const pAngle = (i / pCount) * Math.PI * 2;
    const pRadius = 110 + ((i*17) % 26) - 13;
    const pSpeed = 0.0015 + ((i*7) % 10) / 6000;
    const pSize = 1.4 + ((i*5) % 4) * 0.6;

    const a = pAngle + t * pSpeed * (listening ? 4 : 1) * 1;
    const r = (pRadius / 160) * rInner + (listening ? Math.sin(t*0.025 + i) * 6 : 0);
    const px = Math.cos(a) * r;
    const py = Math.sin(a) * r;
    const isAccent = i % 7 === 0;

    svg += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${pSize * (listening ? 1.2 : 1)}" fill="${isAccent ? hsl : 'rgba(255,255,255,0.4)'}" opacity="${isAccent ? 0.7 : 0.32}" style="filter: blur(0.4px);" />`;
  }

  // Waves (simplified)
  const N = 48;
  const freqA = 3, freqB = 2;
  let wavePath = '';
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    const wave = Math.sin(a * freqA + t * 0.04) * 0.5 + Math.cos(a * freqB - t * 0.025) * 0.5;
    const r = rWave + (waveAmp * 0.45 + wave * waveAmp * (listening ? 2.2 : 0.8));
    const x = (Math.cos(a) * r).toFixed(2);
    const y = (Math.sin(a) * r).toFixed(2);
    wavePath += (i === 0 ? 'M' : 'L') + x + ',' + y + ' ';
  }
  wavePath += 'Z';

  svg += `<path d="${wavePath}" stroke="${hsl}" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="${listening ? 0.72 : 0.38}" ${listening ? `style="filter: drop-shadow(0 0 5px ${hsl}66);"` : ''} />`;

  // Glow
  svg += `<circle cx="0" cy="0" r="${rOrb * 1.5}" fill="url(#orbglow)" />`;

  // Orb
  svg += `<circle cx="0" cy="0" r="${rOrb}" fill="url(#orb)" />`;

  // Inner highlight
  svg += `<ellipse cx="${-rOrb * 0.20}" cy="${-rOrb * 0.32}" rx="${rOrb * 0.42}" ry="${rOrb * 0.26}" fill="rgba(255,255,255,0.16)" style="filter:blur(2px);" />`;

  // Breathing pulse
  if (listening) {
    svg += `<circle cx="0" cy="0" r="${rOrb}" fill="none" stroke="${hsl}" stroke-width="0.8" opacity="0.5" style="transform-origin: center; animation: ondasBreathe 2.4s ease-in-out infinite;" />`;
  }

  orbSvg.innerHTML = svg;
}

// ──────────────────────────────────────────────────────────────
// Animation loop
// ──────────────────────────────────────────────────────────────

function animate() {
  t = (t + 1) % 10000;
  mapTick = (mapTick + 1) % 1000;
  renderOrb();

  // Update map ripple animation if visible (without re-rendering entire map)
  if (!screenSettings.classList.contains('hidden')) {
    const ripple = (Math.sin(mapTick * 0.08) + 1) / 2;
    const voice = ONDAS_VOICES[currentVoiceIdx];
    const rippleEl = document.querySelector('circle[data-ripple="true"]');
    if (rippleEl) {
      rippleEl.setAttribute('r', 12 + ripple * 6);
      rippleEl.setAttribute('opacity', Math.max(0, 0.5 - ripple * 0.35));
    }
  }

  rafId = requestAnimationFrame(animate);
}

// ──────────────────────────────────────────────────────────────
// Event listeners
// ──────────────────────────────────────────────────────────────

orbBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (appState !== 'idle') return;
  unlockAudio();

  // Use new continuous conversation mode
  if (conversationManager) {
    setState('en vivo'); // Show "EN VIVO"
    conversationManager.start();
  }
});

orbBtn.addEventListener('pointerup', () => {
  if (appState === 'en vivo') {
    setState('idle');
    if (conversationManager) {
      conversationManager.stop();
    }
  }
});

orbBtn.addEventListener('pointercancel', () => {
  if (appState === 'en vivo') {
    setState('idle');
    if (conversationManager) {
      conversationManager.stop();
    }
  }
});

// Text toggle removed (subtitles no longer in DOM)
// toggleTextBtn.addEventListener('click', () => { ... });

// Settings
btnSettings.addEventListener('click', () => {
  screenConversation.classList.add('hidden');
  screenSettings.classList.remove('hidden');
  renderVoicesMap();
});

btnSettingsClose.addEventListener('click', () => {
  screenSettings.classList.add('hidden');
  screenConversation.classList.remove('hidden');
});

btnReset.addEventListener('click', () => {
  chronoStop();
  history = [];
  setPrompt('Pulsa para hablar');
  setSub('');
});

// Duration slider
durationSlider.addEventListener('input', e => {
  const val = +e.target.value;
  durationValue.textContent = val;
  const pct = ((val - 5) / 10) * 100;
  durationFill.style.width = pct + '%';
  durationThumb.style.left = `calc(${pct}% - 10px)`;
});

// Save settings
btnSave.addEventListener('click', () => {
  localStorage.setItem('tts_voice', ONDAS_VOICES[currentVoiceIdx].id);
  localStorage.setItem('session_duration', durationSlider.value);
  screenSettings.classList.add('hidden');
  screenConversation.classList.remove('hidden');
  updateVoicePill();
});

// ──────────────────────────────────────────────────────────────
// Settings screen — Map
// ──────────────────────────────────────────────────────────────

function renderVoicesMap() {
  const mapSvg = document.getElementById('voices-map');

  let svg = `<g opacity="0.6" stroke="rgba(255,255,255,0.08)" stroke-width="0.55" fill="none" stroke-dasharray="1.4 4" stroke-linecap="round">
    <path d="M276 30 C 296 22, 326 26, 332 50 C 336 70, 318 86, 296 84 C 276 82, 264 64, 270 44 Z" />
    <path d="M335 100 C 345 122, 348 150, 340 168 C 332 180, 320 178, 316 168" />
    <path d="M28 28 C 50 60, 76 90, 104 110 C 134 128, 156 144, 172 170" />
    <path d="M115 56 C 138 78, 158 96, 178 116 C 190 132, 198 152, 196 172" />
    <path d="M182 178 C 208 202, 228 226, 234 256" />
    <path d="M150 188 C 148 218, 158 254, 178 270" />
  </g>`;

  ONDAS_VOICES.forEach((voice, idx) => {
    const sel = idx === currentVoiceIdx;
    const hsl = `hsl(${voice.hue}, 60%, 72%)`;

    if (sel) {
      svg += `<circle cx="${voice.x}" cy="${voice.y}" r="10" fill="hsla(${voice.hue}, 60%, 70%, 0.18)" />
        <circle cx="${voice.x}" cy="${voice.y}" r="12" fill="none" stroke="${hsl}" stroke-width="0.7" opacity="0.5" data-ripple="true" />`;
    }

    svg += `<g style="cursor: pointer;" data-voice-idx="${idx}">
      <circle cx="${voice.x}" cy="${voice.y}" r="${sel ? 4.2 : 2}" fill="${hsl}" opacity="${sel ? 1 : 0.6}"
        style="filter: ${sel ? `drop-shadow(0 0 7px hsla(${voice.hue}, 70%, 70%, 0.9))` : `drop-shadow(0 0 2px hsla(${voice.hue}, 50%, 60%, 0.45))`}; transition: r 0.25s, opacity 0.25s;" />
      <circle cx="${voice.x}" cy="${voice.y}" r="14" fill="transparent" />
    </g>`;
  });

  mapSvg.innerHTML = svg;

  // Add click listeners (do this once after rendering)
  mapSvg.querySelectorAll('g[data-voice-idx]').forEach(el => {
    el.addEventListener('click', () => {
      currentVoiceIdx = +el.getAttribute('data-voice-idx');
      updateSelectedVoiceCard();
      renderVoicesMap(); // Re-render to update selection
    });
  });
}

function updateSelectedVoiceCard() {
  const voice = ONDAS_VOICES[currentVoiceIdx];
  selectedVoiceName.textContent = voice.name;
  selectedVoiceCity.textContent = voice.city;
  selectedVoiceMeta.textContent = `${voice.country} · ${voice.tag}`;
  voiceCounter.textContent = `${String(currentVoiceIdx + 1).padStart(2, '0')} / 44`;

  // Update accent color and haze
  const hsl = `hsl(${voice.hue}, 60%, 72%)`;
  document.documentElement.style.setProperty('--accent', hsl);
  document.documentElement.style.setProperty('--hue-dyn', voice.hue);
}

// ──────────────────────────────────────────────────────────────
// Initialization
// ──────────────────────────────────────────────────────────────

function init() {
  initMime();
  currentVoiceIdx = getVoiceIndex();
  sessionDuration = parseInt(localStorage.getItem('session_duration') || '10', 10);
  durationSlider.value = sessionDuration;
  durationValue.textContent = sessionDuration;

  updateVoicePill();
  updateSelectedVoiceCard();
  setPrompt('Pulsa para hablar');
  setSub('');
  setState('idle');

  // Initialize audio context
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  // Initialize new conversation manager (continuous listening)
  conversationManager = new ConversationManager();
  console.log('[Conv] Manager initialized');

  // Start animation loop
  animate();

  // Add style for breathing animation
  const style = document.createElement('style');
  style.textContent = `@keyframes ondasBreathe {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.08); opacity: 0; }
  }`;
  document.head.appendChild(style);
}

// Start when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

        .catch(err => console.warn('[SW] Registration failed:', err));
