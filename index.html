<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Espagnolai — Ondas</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Espagnolai">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg1: #2A2E48;
      --bg2: #181B2D;
      --bg3: #0D0F1A;
      --peach: #E8B8C8;
      --peachDk: #C98EA0;
      --lilac: #B8DAC8;
      --lilacDk: #8FB39E;
      --sage: #C8E0D2;
      --ink: #E8E6F0;
      --inkSoft: rgba(255,255,255,0.62);
      --inkDim: rgba(255,255,255,0.32);
      --rule: rgba(255,255,255,0.08);
      --accent: #7BA8E0;
      --accent2: #a4c8f4;
      --sans: 'Geist', system-ui, sans-serif;
      --mono: 'Geist Mono', monospace;
      --serif: 'Instrument Serif', Georgia, serif;
    }

    :root.pal-dusk {
      --bg1: #3A2F4A; --bg2: #231E33; --bg3: #15111E;
      --peach: #F2B8A2; --peachDk: #E08F73; --lilac: #C8B8E3; --lilacDk: #9E8FBA;
      --sage: #BAD6C2; --ink: #EDE7F0;
    }
    :root.pal-mist {
      --bg1: #2E3A3D; --bg2: #1A2326; --bg3: #0E1416;
      --peach: #E8D4B5; --peachDk: #C9B58E; --lilac: #B5D4CE; --lilacDk: #8FB0AA;
      --sage: #C8DCD0; --ink: #E8EDEC;
    }
    :root.pal-cocoa {
      --bg1: #3D2F26; --bg2: #241A14; --bg3: #13100D;
      --peach: #E8A578; --peachDk: #C77F4C; --lilac: #D8C5A8; --lilacDk: #B09877;
      --sage: #C9B894; --ink: #F0E8DD;
    }
    :root.pal-graphite {
      --bg1: #2D2D33; --bg2: #1A1A1F; --bg3: #0E0E11;
      --peach: #E8DCC8; --peachDk: #C9BA9C; --lilac: #BFC5D2; --lilacDk: #959DAC;
      --sage: #C8D2C0; --ink: #E8E8EC;
    }

    html, body {
      height: 100%;
      background: var(--bg1);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-text-size-adjust: 100%;
      overflow: hidden;
    }

    #app {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100%;
      background:
        radial-gradient(140% 100% at 50% 0%,
          hsla(220, 65%, 62%, 0.10) 0%,
          hsla(220, 60%, 50%, 0.05) 45%,
          var(--bg3) 100%),
        radial-gradient(140% 100% at 50% 0%, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
      position: relative;
    }

    .app-container {
      position: relative;
      width: 100%;
      max-width: 402px;
      height: 100vh;
      max-height: 874px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    /* ── Screen: Conversation ── */
    .screen-conversation {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── HUD ── */
    .hud {
      position: absolute;
      top: 52px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .hud-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--inkDim);
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }
    .status-dot.listening {
      background: var(--accent2);
      box-shadow: 0 0 8px var(--accent2);
      animation: dot-pulse 1.4s ease-in-out infinite;
    }
    .status-dot.speaking {
      background: var(--lilac);
      box-shadow: 0 0 8px var(--lilac);
      animation: none;
    }

    @keyframes dot-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    #status-text {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--inkDim);
      text-transform: uppercase;
      transition: color 0.3s;
    }

    .hud-right {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--inkDim);
      text-transform: uppercase;
    }

    .hud-controls {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--rule);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      color: var(--inkSoft);
      transition: border-color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active {
      background: rgba(255,255,255,0.08);
    }
    .icon-btn svg {
      width: 15px; height: 15px;
      stroke: currentColor; stroke-width: 1.4;
      stroke-linecap: round; stroke-linejoin: round; fill: none;
    }

    /* ── Orb ── */
    .orb-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -54%);
      width: 372px;
      height: 372px;
      z-index: 5;
    }

    .orb-btn {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #orb-canvas {
      display: block;
      border-radius: 50%;
    }

    /* ── Prompt label (below orb) ── */
    .orb-label {
      position: absolute;
      top: calc(50% + 118px);
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--serif);
      font-style: italic;
      font-size: 17px;
      color: var(--inkSoft);
      text-align: center;
      white-space: nowrap;
      transition: opacity 0.4s;
      pointer-events: none;
      z-index: 10;
    }

    /* ── Timer ── */
    .timer-container {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
      pointer-events: none;
    }

    .timer {
      font-family: var(--serif);
      font-weight: 300;
      font-size: 52px;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, var(--ink) 55%, rgba(255,255,255,0.55) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .timer-colon {
      display: inline-block;
      font-style: normal;
      font-weight: 300;
      font-size: 0.5em;
      vertical-align: 0.34em;
      padding: 0 0.36em;
    }

    .timer-progress {
      position: relative;
      width: 240px;
      height: 14px;
      margin: 14px auto 0;
    }

    .timer-track {
      position: absolute;
      left: 0; right: 0; top: 50%;
      height: 1px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, transparent 0%, var(--rule) 12%, var(--rule) 88%, transparent 100%);
    }

    .timer-fill {
      position: absolute;
      left: 0; top: 50%;
      height: 1px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, transparent 0%, var(--accent2) 35%, var(--accent2) 100%);
      box-shadow: 0 0 8px var(--accent2), 0 0 14px rgba(164,200,244,0.3);
      transition: width 800ms ease;
    }

    .timer-dot {
      position: absolute;
      top: 50%;
      width: 10px; height: 10px;
      transform: translateY(-50%);
      border-radius: 50%;
      background: var(--accent2);
      box-shadow: 0 0 8px var(--accent2);
      transition: left 100ms ease;
    }

    .timer-labels {
      display: flex;
      justify-content: space-between;
      max-width: 240px;
      margin: 10px auto 0;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--inkDim);
      letter-spacing: 1.4px;
    }

    /* ── Screen: Settings ── */
    .screen-settings {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg3);
      z-index: 30;
      overflow-y: auto;
    }
    .screen-settings.hidden { display: none; }

    .settings-header {
      position: absolute;
      top: 62px;
      left: 24px; right: 24px;
      z-index: 20;
    }

    .settings-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .settings-close-btn {
      background: transparent;
      border: none;
      color: var(--inkSoft);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .settings-subtitle {
      font-family: var(--serif);
      font-weight: 300;
      font-size: 36px;
      line-height: 1.05;
      letter-spacing: -0.4px;
      margin-top: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, var(--ink) 55%, rgba(255,255,255,0.55) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .settings-section-label {
      position: absolute;
      top: 184px;
      left: 24px; right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 2px;
      color: var(--inkDim);
      text-transform: uppercase;
      z-index: 20;
    }

    .voices-grid {
      position: absolute;
      top: 212px;
      left: 24px; right: 24px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .voice-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--rule);
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--sans);
      font-size: 11px;
      color: var(--ink);
      text-align: left;
    }
    .voice-btn:hover { background: rgba(255,255,255,0.08); }
    .voice-btn[data-selected="true"] {
      border-color: var(--accent);
      background: rgba(123,168,224,0.1);
      box-shadow: 0 0 0 1.5px var(--accent) inset;
      color: var(--accent2);
    }

    .voice-dot-mini {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .voice-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .settings-selected-voice {
      position: absolute;
      top: 524px;
      left: 24px; right: 24px;
      text-align: center;
    }

    .selected-voice-name {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 34px;
      line-height: 1;
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, var(--accent2) 55%, rgba(255,255,255,0.55) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .selected-voice-city {
      font-family: var(--serif);
      font-style: italic;
      font-size: 17px;
      color: var(--inkSoft);
      margin-top: 2px;
    }

    .selected-voice-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--inkDim);
      letter-spacing: 2.2px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .settings-duration {
      position: absolute;
      top: 614px;
      left: 24px; right: 24px;
    }

    .duration-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .duration-label-text {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 2px;
      color: var(--inkDim);
      text-transform: uppercase;
    }

    .duration-value {
      font-family: var(--serif);
      font-weight: 300;
      font-size: 44px;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, var(--ink) 55%, rgba(255,255,255,0.55) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .duration-min {
      font-family: var(--serif);
      font-style: italic;
      font-size: 16px;
      color: var(--inkSoft);
      margin-left: 6px;
    }

    .duration-slider-container {
      position: relative;
      height: 36px;
      margin-top: 12px;
    }

    .duration-slider {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      margin: 0;
      width: 100%;
    }

    .duration-track {
      position: absolute;
      top: 17px; left: 0; right: 0;
      height: 2px;
      background: var(--rule);
      border-radius: 1px;
    }

    .duration-fill {
      position: absolute;
      top: 17px; left: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--lilac), var(--accent));
      box-shadow: 0 0 14px rgba(123,168,224,0.5);
      border-radius: 1px;
      transition: width 0.1s;
    }

    .duration-thumb {
      position: absolute;
      top: 8px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 1.5px var(--accent), 0 0 16px rgba(123,168,224,0.6);
      pointer-events: none;
      transition: left 0.1s;
    }

    .duration-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--inkDim);
      letter-spacing: 1.5px;
    }

    .settings-save {
      position: absolute;
      bottom: 62px;
      left: 24px; right: 24px;
      width: calc(100% - 48px);
      padding: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.04) 40%, rgba(255,255,255,0) 100%),
                  linear-gradient(120deg, var(--lilac) 0%, var(--accent2) 68%, var(--peach) 100%);
      border: none;
      border-radius: 999px;
      color: #1A1424;
      font-family: var(--sans);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 0 28px rgba(164,200,244,0.4), 0 6px 20px rgba(0,0,0,0.22);
      transition: box-shadow 250ms;
    }

    .voices-grid::-webkit-scrollbar { width: 6px; }
    .voices-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

    /* ── Groq key panel ── */
    .key-panel {
      position: absolute;
      inset: 0;
      background: var(--bg3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 32px 24px;
      z-index: 40;
    }
    .key-panel.hidden { display: none; }
    .key-panel h3 { font-size: 1rem; font-weight: 500; }
    .key-panel input {
      width: 100%; max-width: 320px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 13px 16px;
      color: var(--ink);
      font-size: 0.9rem;
      outline: none;
    }
    .key-panel input:focus { border-color: var(--accent); }
    .key-panel button {
      width: 100%; max-width: 320px;
      padding: 14px; border: none; border-radius: 12px;
      background: var(--accent); color: #fff;
      font-weight: 600; font-size: 1rem; cursor: pointer;
    }
  </style>
</head>
<body>

<div id="app">
  <div class="app-container">

    <!-- ═══ Screen: Conversation ═══ -->
    <div class="screen-conversation" id="screen-conversation">

      <!-- HUD -->
      <div class="hud">
        <div class="hud-status">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">INACTIVO</span>
        </div>
        <div class="hud-controls">
          <button class="icon-btn" id="btn-reset" title="reiniciar">
            <svg viewBox="0 0 16 16"><path d="M2 8a6 6 0 1 1 6 6M2 8v-4M2 8h4"/></svg>
          </button>
          <button class="icon-btn" id="btn-settings" title="ajustes">
            <svg viewBox="0 0 16 16">
              <circle cx="8" cy="8" r="1.6"/>
              <path d="M8 2v1.4M8 12.6V14M2 8h1.4M12.6 8H14M3.5 3.5l1 1M11.5 11.5l1 1M3.5 12.5l1-1M11.5 4.5l1-1"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Orb -->
      <div class="orb-container">
        <button class="orb-btn" id="orb-btn">
          <canvas id="orb-canvas" width="372" height="372"></canvas>
        </button>
      </div>

      <!-- Orb prompt label -->
      <div class="orb-label" id="orb-label">Pulsa para hablar</div>

      <!-- Timer -->
      <div class="timer-container">
        <div class="timer">
          <span id="timer-mm">00</span>
          <span class="timer-colon">:</span>
          <span id="timer-ss">00</span>
        </div>
        <div class="timer-progress">
          <div class="timer-track"></div>
          <div class="timer-fill" id="timer-fill" style="width:0%"></div>
          <div class="timer-dot"  id="timer-dot"  style="left:-5px"></div>
        </div>
        <div class="timer-labels">
          <span>0:00</span><span id="timer-mid-label">5:00</span><span id="timer-max-label">10:00</span>
        </div>
      </div>

    </div><!-- /screen-conversation -->

    <!-- ═══ Screen: Settings ═══ -->
    <div class="screen-settings hidden" id="screen-settings">
      <div class="settings-header">
        <div class="settings-title-row">
          <span style="font-family:var(--mono);font-size:10.5px;letter-spacing:2px;color:var(--inkSoft);text-transform:uppercase;">Ajustes</span>
          <button class="settings-close-btn" id="btn-settings-close">cerrar ✕</button>
        </div>
        <h2 class="settings-subtitle">Elige una <span style="font-style:italic;">voz</span></h2>
      </div>

      <div class="settings-section-label">
        <span>Mundo hispanohablante</span>
        <span id="voice-counter">01 / 01</span>
      </div>

      <svg id="voices-map" viewBox="0 0 360 290" width="100%" height="290"
           style="position:absolute;top:212px;left:0;right:0;overflow:visible;display:block;padding:0 16px;max-width:402px;"></svg>

      <div class="settings-selected-voice">
        <div class="selected-voice-name" id="selected-voice-name">Elvira</div>
        <div class="selected-voice-city" id="selected-voice-city">Madrid</div>
        <div class="selected-voice-meta" id="selected-voice-meta">España · paciente</div>
      </div>

      <div class="settings-duration">
        <div class="duration-label">
          <span class="duration-label-text">Duración</span>
          <div>
            <span class="duration-value" id="duration-value">10</span>
            <span class="duration-min">min</span>
          </div>
        </div>
        <div class="duration-slider-container">
          <div class="duration-track"></div>
          <div class="duration-fill"  id="duration-fill"></div>
          <input type="range" min="1" max="30" value="10" class="duration-slider" id="duration-slider">
          <div class="duration-thumb" id="duration-thumb"></div>
        </div>
        <div class="duration-labels"><span>1 MIN</span><span>15</span><span>30 MIN</span></div>
      </div>

      <button class="settings-save" id="btn-save">Guardar</button>
    </div><!-- /screen-settings -->

  </div><!-- /app-container -->
</div><!-- /app -->

<script>
'use strict';

// ──────────────────────────────────────────────────────────────
// Config
// ──────────────────────────────────────────────────────────────
const GROQ_STT   = 'https://api.groq.com/openai/v1/audio/transcriptions';
const GROQ_CHAT  = 'https://api.groq.com/openai/v1/chat/completions';
const GROQ_MODEL = 'llama-3.3-70b-versatile';
const HIST_MAX   = 10;

const SYSTEM = `Eres un profesor de español nativo, amigable y natural.
Hablas con el usuario como en una conversación real.
Responde SIEMPRE en español. Máximo 1-2 frases — la conversación continúa, no hace falta resumir.
Intervén cuando el usuario hace una pausa, duda, hace una pregunta o comete un error.
Si hay un error gramatical o de vocabulario, corrígelo de forma natural dentro de tu respuesta, sin explicar la regla.
Nunca repitas literalmente lo que dijo el usuario. Ve directo.`;

const DEFAULT_KEY   = 'gsk_35UnVKG48PEbowk6YTWE' + 'WGdyb3FYvcIaFYQLE5JjOJ6asJI81CPW';

// ──────────────────────────────────────────────────────────────
// Orb Canvas — three-state particle + wave system
// ──────────────────────────────────────────────────────────────
const ctx2d = orbCanvas.getContext('2d');
const CW = orbCanvas.width;   // 372
const CH = orbCanvas.height;  // 372
const CX = CW / 2;            // 186
const CY = CH / 2;            // 186
const ORB_R = 80;

// 22 particles with randomised orbits
const PARTICLES = Array.from({ length: 22 }, (_, i) => ({
  angle: (i / 22) * Math.PI * 2 + (Math.random() - 0.5) * 0.8,
  r:     92 + Math.random() * 58,          // orbit radius 92–150
  size:  1.4 + Math.random() * 2.2,        // dot size 1.4–3.6
  speed: (0.004 + Math.random() * 0.004) * (Math.random() > 0.5 ? 1 : -1),
  opac:  0.35 + Math.random() * 0.5,
}));

let waveList      = [];
let lastWaveSpawn = 0;

function drawOrbFrame(t) {
  ctx2d.clearRect(0, 0, CW, CH);
  const mode = appState;

  // ── Outer ambient glow (session + ai-speaking) ───────────────
  if (mode !== 'inactive') {
    const glowR = mode === 'ai-speaking' ? 138 : 118;
    const glowA = mode === 'ai-speaking' ? 0.20 : 0.12;
    const grd   = ctx2d.createRadialGradient(CX, CY, ORB_R - 4, CX, CY, glowR);
    grd.addColorStop(0, `rgba(110,175,255,${glowA})`);
    grd.addColorStop(1,  'rgba(90,150,255,0)');
    ctx2d.fillStyle = grd;
    ctx2d.beginPath();
    ctx2d.arc(CX, CY, glowR, 0, Math.PI * 2);
    ctx2d.fill();
  }

  // ── Expanding wave rings (ai-speaking only) ──────────────────
  if (mode === 'ai-speaking') {
    if (t - lastWaveSpawn > 750) {
      waveList.push({ r: ORB_R + 2, opac: 0.75 });
      lastWaveSpawn = t;
    }
    for (const w of waveList) {
      ctx2d.strokeStyle = `rgba(160,215,255,${w.opac * 0.55})`;
      ctx2d.lineWidth   = 1.2;
      ctx2d.beginPath();
      ctx2d.arc(CX, CY, w.r, 0, Math.PI * 2);
      ctx2d.stroke();
      w.r    += 0.75;
      w.opac *= 0.982;
    }
    waveList = waveList.filter(w => w.opac > 0.02);
  } else {
    waveList = [];
  }

  // ── Sphere body ──────────────────────────────────────────────
  const bGrd = ctx2d.createRadialGradient(CX - 22, CY - 26, 4, CX, CY, ORB_R);
  if (mode === 'inactive') {
    bGrd.addColorStop(0,    'rgba(80,105,140,0.42)');
    bGrd.addColorStop(0.55, 'rgba(20,35,68,0.62)');
    bGrd.addColorStop(1,    'rgba(6,10,24,0.88)');
  } else if (mode === 'session') {
    bGrd.addColorStop(0,    'rgba(185,225,255,0.76)');
    bGrd.addColorStop(0.42, 'rgba(65,150,238,0.56)');
    bGrd.addColorStop(1,    'rgba(7,16,52,0.92)');
  } else { // ai-speaking
    bGrd.addColorStop(0,    'rgba(215,240,255,0.90)');
    bGrd.addColorStop(0.35, 'rgba(88,172,255,0.62)');
    bGrd.addColorStop(1,    'rgba(9,19,62,0.94)');
  }
  ctx2d.fillStyle = bGrd;
  ctx2d.beginPath();
  ctx2d.arc(CX, CY, ORB_R, 0, Math.PI * 2);
  ctx2d.fill();

  // ── Shine highlight (session + ai-speaking) ──────────────────
  if (mode !== 'inactive') {
    const shA  = mode === 'ai-speaking' ? 0.62 : 0.42;
    const shGrd = ctx2d.createRadialGradient(CX - 28, CY - 30, 1, CX - 18, CY - 18, 44);
    shGrd.addColorStop(0,    `rgba(255,255,255,${shA})`);
    shGrd.addColorStop(0.55,  'rgba(255,255,255,0.04)');
    shGrd.addColorStop(1,     'rgba(255,255,255,0)');
    ctx2d.save();
    ctx2d.beginPath();
    ctx2d.arc(CX, CY, ORB_R, 0, Math.PI * 2);
    ctx2d.clip();
    ctx2d.fillStyle = shGrd;
    ctx2d.fillRect(CX - ORB_R, CY - ORB_R, ORB_R * 2, ORB_R * 2);
    ctx2d.restore();
    // thin edge ring
    ctx2d.strokeStyle = 'rgba(170,215,255,0.20)';
    ctx2d.lineWidth   = 0.8;
    ctx2d.beginPath();
    ctx2d.arc(CX, CY, ORB_R, 0, Math.PI * 2);
    ctx2d.stroke();
  }

  // ── Particles (session + ai-speaking) ────────────────────────
  if (mode !== 'inactive') {
    const speedMult = mode === 'ai-speaking' ? 3.8 : 1;
    for (const p of PARTICLES) {
      p.angle += p.speed * speedMult;
      const px = CX + Math.cos(p.angle) * p.r;
      const py = CY + Math.sin(p.angle) * p.r;
      // fade particles that pass "behind" the sphere
      const behind = p.r < 108 && Math.sin(p.angle) > 0.3 && Math.cos(p.angle) < 0.4;
      const alpha  = p.opac * (behind ? 0.28 : 1);
      ctx2d.fillStyle = mode === 'ai-speaking'
        ? `rgba(195,230,255,${alpha})`
        : `rgba(155,205,255,${alpha * 0.88})`;
      ctx2d.beginPath();
      ctx2d.arc(px, py, p.size, 0, Math.PI * 2);
      ctx2d.fill();
    }
  }

  requestAnimationFrame(drawOrbFrame);
}

// ──────────────────────────────────────────────────────────────
// Timer / Chrono
// ──────────────────────────────────────────────────────────────
let chronoSeconds  = 0;
let sessionDuration = 10;
let chronoInterval  = null;

function chronoTick() {
  if (chronoSeconds <= 0) {
    clearInterval(chronoInterval);
    chronoInterval = null;
    stopSession();
    return;
  }
  chronoSeconds--;
  const mm  = String(Math.floor(chronoSeconds / 60)).padStart(2, '0');
  const ss  = String(chronoSeconds % 60).padStart(2, '0');
  timerMm.textContent = mm;
  timerSs.textContent = ss;
  const pct = chronoSeconds / (sessionDuration * 60);
  timerFill.style.width = `${pct * 100}%`;
  timerDot.style.left   = `calc(${pct * 100}% - 5px)`;
}

function chronoStart(durationMinutes) {
  if (chronoInterval) return;
  sessionDuration = durationMinutes;
  chronoSeconds   = durationMinutes * 60;
  const mm = String(Math.floor(chronoSeconds / 60)).padStart(2, '0');
  const ss = String(chronoSeconds % 60).padStart(2, '0');
  timerMm.textContent       = mm;
  timerSs.textContent       = ss;
  timerFill.style.width     = '100%';
  timerDot.style.left       = 'calc(100% - 5px)';
  chronoInterval = setInterval(chronoTick, 1000);
}

function chronoStop() {
  clearInterval(chronoInterval);
  chronoInterval = null;
  timerMm.textContent   = '00';
  timerSs.textContent   = '00';
  timerFill.style.width = '0%';
  timerDot.style.left   = '-5px';
}

// ──────────────────────────────────────────────────────────────
// Audio context
// ──────────────────────────────────────────────────────────────
function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume().catch(() => {});
}

// ──────────────────────────────────────────────────────────────
// Session lifecycle
// ──────────────────────────────────────────────────────────────
async function startSession() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    recorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    recorder.start(100);
    sessionActive = true;
    startRecognition();
    setState('session');
    chronoStart(getDuration());
  } catch (e) {
    console.error('[mic]', e.message);
    setState('inactive');
  }
}

function stopSession() {
  sessionActive = false;
  stopRecognition();
  if (recorder && recorder.state !== 'inactive') {
    recorder.stop();
    recorder.stream.getTracks().forEach(t => t.stop());
  }
  recorder    = null;
  audioChunks = [];
  aiSpeaking  = false;
  processing  = false;
  setState('inactive');
  chronoStop();
  history = [];
}

// ──────────────────────────────────────────────────────────────
// Web Speech recognition
// ──────────────────────────────────────────────────────────────
function startRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  recognition = new SR();
  recognition.continuous     = true;
  recognition.interimResults = true;
  recognition.lang           = 'es-ES';
  recognition.onresult    = handleSpeechResult;
  recognition.onspeechend = () => setTimeout(triggerProcessing, 300);
  recognition.onerror     = e => { if (e.error !== 'no-speech') console.warn('[SR]', e.error); };
  recognition.onend       = () => { if (sessionActive) recognition.start(); };
  recognition.start();
}

function stopRecognition() {
  if (!recognition) return;
  recognition.onend = null;
  recognition.stop();
  recognition = null;
}

function handleSpeechResult(e) {
  let hasFinal = false;
  for (let i = e.resultIndex; i < e.results.length; i++) {
    if (e.results[i].isFinal) hasFinal = true;
  }
  if (hasFinal) triggerProcessing();
}

// ──────────────────────────────────────────────────────────────
// Trigger pipeline  STT → LLM → TTS
// ──────────────────────────────────────────────────────────────
async function triggerProcessing() {
  if (processing || !sessionActive) return;

  // User spoke while AI was speaking — interrupt TTS and let this call take over
  if (aiSpeaking) {
    interruptTTS();
    // The ongoing pipeline's finally block will reset flags asynchronously.
    // Don't proceed now; the next speech event will re-trigger once flags clear.
    return;
  }

  const chunks = audioChunks.splice(0);
  if (chunks.length === 0) return;

  processing = true;
  const type = (recorder && recorder.mimeType) || mimeType || 'audio/webm';
  const blob = new Blob(chunks, { type });

  try {
    const transcript = await stt(blob, type);
    if (!transcript.trim()) return;
    history.push({ role: 'user', content: transcript });
    if (history.length > HIST_MAX * 2) history = history.slice(-HIST_MAX * 2);

    aiSpeaking = true;
    if (sessionActive) setState('ai-speaking');

    const reply = await llm();
    history.push({ role: 'assistant', content: reply });
    if (history.length > HIST_MAX * 2) history = history.slice(-HIST_MAX * 2);

    await speak(reply);
  } catch (e) {
    console.error('[pipeline]', e.message);
  } finally {
    aiSpeaking = false;
    processing  = false;
    // Discard any audio recorded while AI was speaking (echo through mic)
    audioChunks.splice(0);
    if (sessionActive) {
      setState('session');
      // Restart recognition to get a clean slate after AI spoke
      stopRecognition();
      startRecognition();
    }
  }
}

// ──────────────────────────────────────────────────────────────
// STT  (Groq Whisper)
// ──────────────────────────────────────────────────────────────
function initMime() {
  for (const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']) {
    if (MediaRecorder.isTypeSupported(t)) { mimeType = t; return; }
  }
}

async function stt(blob, type) {
  const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
  const fd  = new FormData();
  fd.append('file', blob, `rec.${ext}`);
  fd.append('model', 'whisper-large-v3');
  fd.append('language', 'es');
  fd.append('response_format', 'json');
  const r = await fetch(GROQ_STT, {
    method: 'POST',
    headers: { Authorization: `Bearer ${groqKey()}` },
    body: fd,
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error?.message || `STT ${r.status}`); }
  return (await r.json()).text || '';
}

// ──────────────────────────────────────────────────────────────
// LLM  (Groq Llama)
// ──────────────────────────────────────────────────────────────
async function llm() {
  const r = await fetch(GROQ_CHAT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${groqKey()}` },
    body: JSON.stringify({
      model:      GROQ_MODEL,
      max_tokens: 200,
      messages:   [{ role: 'system', content: SYSTEM }, ...history],
    }),
  });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error?.message || `LLM ${r.status}`); }
  return (await r.json()).choices[0]?.message?.content || '';
}

// ──────────────────────────────────────────────────────────────
// TTS  (espagnol-tts via Vercel proxy)
// ──────────────────────────────────────────────────────────────
function splitText(text, max = 180) {
  const parts = text.match(/[^.!?]+[.!?]*/g) || [text];
  const out = [];
  let cur = '';
  for (const p of parts) {
    if (cur.length + p.length > max && cur) { out.push(cur.trim()); cur = p; }
    else cur += p;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

async function speakChunk(text) {
  const voice = getVoiceKey();
  const r = await fetch(`/api/tts?text=${encodeURIComponent(text)}&voice=${encodeURIComponent(voice)}`);
  if (!r.ok) throw new Error(`TTS ${r.status}`);
  const decoded = await audioCtx.decodeAudioData(await r.arrayBuffer());
  const src = audioCtx.createBufferSource();
  src.buffer = decoded;
  src.connect(audioCtx.destination);
  ttsSource = src;
  return new Promise((resolve, reject) => {
    src.onended = () => { if (ttsSource === src) ttsSource = null; resolve(); };
    src.onerror = reject;
    src.start(0);
  });
}

async function speak(text) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  const myToken = speakToken;
  for (const chunk of splitText(text)) {
    if (speakToken !== myToken) break; // interrupted
    await speakChunk(chunk);
  }
}

function initVoicesMap() {
  const NS     = 'http://www.w3.org/2000/svg';
  const mapSvg = document.getElementById('voices-map');
  const nameEl = document.getElementById('selected-voice-name');
  const cityEl = document.getElementById('selected-voice-city');
  const metaEl = document.getElementById('selected-voice-meta');
  const ctrEl  = document.getElementById('voice-counter');

  function selectVoice(v, save) {
    if (save) localStorage.setItem('voice_key', v.id);
    nameEl.textContent = v.name;
    cityEl.textContent = v.city;
    metaEl.textContent = `${v.country} · ${v.trait}`;
    const idx = VOICES.findIndex(x => x.id === v.id) + 1;
    ctrEl.textContent  = `${String(idx).padStart(2,'0')} / ${VOICES.length}`;
    renderMap(v.id);
  }

  function renderMap(selectedId) {
    mapSvg.innerHTML = '';

    // faint constellation lines between geographic neighbours
    const links = [
      [0,1],[2,3],[4,5],[4,2],[5,3],[6,7],[8,9],[8,4],[9,5],
      [10,11],[10,12],[11,13],[12,14],[14,15],[16,15],[17,18],
      [19,20],[19,17],[20,18],[21,17],[21,19],
    ];
    for (const [a, b] of links) {
      const va = VOICES[a], vb = VOICES[b];
      if (!va || !vb) continue;
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', va.x); line.setAttribute('y1', va.y);
      line.setAttribute('x2', vb.x); line.setAttribute('y2', vb.y);
      line.setAttribute('stroke', 'rgba(255,255,255,0.08)');
      line.setAttribute('stroke-width', '0.8');
      mapSvg.appendChild(line);
    }

    // dots
    for (const v of VOICES) {
      const isSel = v.id === selectedId;
      const g = document.createElementNS(NS, 'g');
      g.style.cursor = 'pointer';

      if (isSel) {
        // outer glow ring
        const ring = document.createElementNS(NS, 'circle');
        ring.setAttribute('cx', v.x); ring.setAttribute('cy', v.y);
        ring.setAttribute('r', '9');
        ring.setAttribute('fill', 'none');
        ring.setAttribute('stroke', 'rgba(164,200,244,0.35)');
        ring.setAttribute('stroke-width', '1');
        g.appendChild(ring);
      }

      const dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('cx', v.x); dot.setAttribute('cy', v.y);
      dot.setAttribute('r', isSel ? '4.5' : '3');
      dot.setAttribute('fill', isSel ? 'rgba(200,228,255,0.95)' : 'rgba(255,255,255,0.32)');
      if (isSel) dot.setAttribute('filter', 'drop-shadow(0 0 5px rgba(164,200,244,0.9))');
      g.appendChild(dot);

      // invisible hit target
      const hit = document.createElementNS(NS, 'circle');
      hit.setAttribute('cx', v.x); hit.setAttribute('cy', v.y);
      hit.setAttribute('r', '14');
      hit.setAttribute('fill', 'transparent');
      g.appendChild(hit);

      g.addEventListener('click', () => selectVoice(v, true));
      mapSvg.appendChild(g);
    }
  }

  // Init with saved or default voice
  const savedId = getVoiceKey();
  const current = VOICES.find(v => v.id === savedId) || VOICES[0];
  selectVoice(current, false);
}

document.getElementById('btn-reset').addEventListener('click', () => {
  if (sessionActive) stopSession();
  history = [];
});

document.getElementById('btn-settings').addEventListener('click', () => {
  document.getElementById('screen-settings').classList.remove('hidden');
});

document.getElementById('btn-settings-close').addEventListener('click', () => {
  document.getElementById('screen-settings').classList.add('hidden');
});

// Duration slider
const durationSlider = document.getElementById('duration-slider');
const durationValue  = document.getElementById('duration-value');
const durationFill   = document.getElementById('duration-fill');
const durationThumb  = document.getElementById('duration-thumb');

function updateDurationSlider(v) {
  const min = parseFloat(durationSlider.min);
  const max = parseFloat(durationSlider.max);
  const pct = (v - min) / (max - min) * 100;
  durationValue.textContent  = v;
  durationFill.style.width   = `${pct}%`;
  durationThumb.style.left   = `calc(${pct}% - 10px)`;
}

durationSlider.addEventListener('input', () => updateDurationSlider(parseInt(durationSlider.value, 10)));

document.getElementById('btn-save').addEventListener('click', () => {
  localStorage.setItem('session_duration', durationSlider.value);
  document.getElementById('screen-settings').classList.add('hidden');
});

// ──────────────────────────────────────────────────────────────
// Boot
// ──────────────────────────────────────────────────────────────
initMime();
setState('inactive');

// Restore saved duration
const savedDuration = getDuration();
durationSlider.value = savedDuration;
updateDurationSlider(savedDuration);

// Start orb animation loop
requestAnimationFrame(drawOrbFrame);

// Init voice map
initVoicesMap();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(r => console.log('[SW] ok', r.scope))
        .catch(e => console.warn('[SW] failed', e));
    });
  }
</script>

</body>
