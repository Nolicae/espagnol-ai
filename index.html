<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EspañolAI</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EspañolAI">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0d14; --surface: #13172a; --border: #1e2235;
      --accent: #7c3aed; --accent2: #a855f7;
      --text: #e8eaf0; --muted: #6b7280;
      --red: #ef4444; --amber: #f59e0b;
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, system-ui, sans-serif;
      -webkit-text-size-adjust: 100%; overflow: hidden;
    }

    /* ── Setup ── */
    #setup {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      padding: 32px 24px; gap: 18px; text-align: center;
    }
    .setup-logo { font-size: 3rem; }
    .setup-title { font-size: 1.8rem; font-weight: 800; }
    .setup-sub { color: var(--muted); font-size: 0.88rem; max-width: 300px; line-height: 1.6; }
    .key-group { width: 100%; max-width: 360px; text-align: left; }
    .key-group label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
    .key-group input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 16px; color: var(--text);
      font-size: 0.95rem; outline: none; -webkit-appearance: none;
    }
    .key-group input:focus { border-color: var(--accent); }
    #start-btn {
      width: 100%; max-width: 360px; background: var(--accent); color: #fff;
      border: none; border-radius: 14px; padding: 16px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    #setup-error { color: var(--red); font-size: 0.82rem; min-height: 18px; }

    /* ── App ── */
    #app {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; gap: 40px;
      padding: 40px 24px; position: relative;
    }
    #state-label {
      font-size: 1rem; font-weight: 600; letter-spacing: 0.04em;
      color: var(--muted); min-height: 1.4em; transition: color 0.3s;
    }
    #state-label.listening { color: var(--red); }
    #state-label.thinking  { color: var(--amber); }
    #state-label.speaking  { color: var(--accent2); }

    #waves { display: flex; align-items: center; gap: 6px; height: 64px; }
    #waves span {
      display: block; width: 6px; border-radius: 3px;
      background: var(--accent); opacity: 0.2;
      animation: w-idle 1.6s ease-in-out infinite;
      transition: opacity 0.3s, background 0.3s;
    }
    #waves span:nth-child(1) { height: 16px; animation-delay: 0.00s; }
    #waves span:nth-child(2) { height: 30px; animation-delay: 0.15s; }
    #waves span:nth-child(3) { height: 48px; animation-delay: 0.30s; }
    #waves span:nth-child(4) { height: 30px; animation-delay: 0.15s; }
    #waves span:nth-child(5) { height: 16px; animation-delay: 0.00s; }
    #waves.listening span { opacity: 1;   background: var(--red);    animation-name: w-listen; }
    #waves.thinking  span { opacity: 0.7; background: var(--amber);  animation-name: w-think;  }
    #waves.speaking  span { opacity: 0.9; background: var(--accent2); animation-name: w-speak; }
    @keyframes w-idle   { 0%,100%{transform:scaleY(.6)} 50%{transform:scaleY(1)}   }
    @keyframes w-listen { 0%,100%{transform:scaleY(.7)} 50%{transform:scaleY(1.4)} }
    @keyframes w-think  { 0%,100%{transform:scaleY(.8)} 50%{transform:scaleY(1.1)} }
    @keyframes w-speak  { 0%,100%{transform:scaleY(.5)} 50%{transform:scaleY(1.5)} }

    #mic-btn {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
      font-size: 2.4rem; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 32px rgba(124,58,237,.4);
      transition: background .2s, opacity .2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: none; user-select: none;
    }
    #mic-btn.listening { background: var(--red); animation: sonar 1.2s ease-out infinite; }
    #mic-btn.busy      { opacity: .35; pointer-events: none; }
    @keyframes sonar {
      0%  { box-shadow: 0 0 0 0    rgba(239,68,68,.7); }
      70% { box-shadow: 0 0 0 32px rgba(239,68,68,0);  }
      100%{ box-shadow: 0 0 0 0    rgba(239,68,68,0);  }
    }

    #subtitle {
      font-size: 0.88rem; color: var(--muted); font-style: italic;
      text-align: center; max-width: 300px; min-height: 2.6em; line-height: 1.6;
    }

    #settings-btn {
      position: absolute; top: 20px; right: 20px;
      background: none; border: none; color: var(--muted);
      font-size: 1.4rem; cursor: pointer; padding: 8px;
    }
    #settings-panel {
      position: absolute; inset: 0; background: var(--bg); z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 32px 24px; gap: 16px;
    }
    #settings-panel h2 { font-size: 1.2rem; margin-bottom: 4px; }
    #settings-close {
      position: absolute; top: 20px; right: 20px;
      background: none; border: none; color: var(--muted);
      font-size: 1.6rem; cursor: pointer; padding: 8px;
    }
    .s-save { width:100%; max-width:360px; background:var(--accent); color:#fff; border:none; border-radius:14px; padding:14px; font-size:1rem; font-weight:700; cursor:pointer; margin-top:4px; }
    .s-out  { background:none; border:1px solid var(--border); color:var(--muted); border-radius:12px; padding:10px 20px; cursor:pointer; font-size:0.85rem; }
    audio { display: none; }
  </style>
</head>
<body>

<!-- ── Setup ── -->
<div id="setup">
  <div class="setup-logo">🇪🇸</div>
  <div class="setup-title">EspañolAI</div>
  <p class="setup-sub">Parle espagnol avec une IA native. Entre tes clés API pour commencer.</p>
  <div class="key-group">
    <label>Clé Groq (voix → texte)</label>
    <input id="groq-key" type="password" placeholder="gsk_…" autocomplete="off">
  </div>
  <div class="key-group">
    <label>Clé DeepSeek (intelligence)</label>
    <input id="ds-key" type="password" placeholder="sk-…" autocomplete="off">
  </div>
  <div class="key-group">
    <label>Clé ElevenLabs (texte → voix)</label>
    <input id="el-key" type="password" placeholder="…" autocomplete="off">
  </div>
  <div id="setup-error"></div>
  <button id="start-btn">Commencer →</button>
</div>

<!-- ── App ── -->
<div id="app" hidden>
  <audio id="audio-el" playsinline webkit-playsinline></audio>
  <button id="settings-btn">⚙️</button>
  <div id="state-label">Toca para hablar</div>
  <div id="waves"><span></span><span></span><span></span><span></span><span></span></div>
  <button id="mic-btn">🎤</button>
  <div id="subtitle"></div>

  <div id="settings-panel" hidden>
    <button id="settings-close">✕</button>
    <h2>⚙️ Paramètres</h2>
    <div class="key-group" style="width:100%;max-width:360px">
      <label>Clé Groq</label><input id="s-groq" type="password" placeholder="gsk_…">
    </div>
    <div class="key-group" style="width:100%;max-width:360px">
      <label>Clé DeepSeek</label><input id="s-ds" type="password" placeholder="sk-…">
    </div>
    <div class="key-group" style="width:100%;max-width:360px">
      <label>Clé ElevenLabs</label><input id="s-el" type="password" placeholder="…">
    </div>
    <button class="s-save" id="s-save">Sauvegarder</button>
    <button class="s-out"  id="s-out">Se déconnecter</button>
  </div>
</div>

<script>
'use strict';

// ── Config ───────────────────────────────────────────────────
const GROQ_URL   = 'https://api.groq.com/openai/v1/audio/transcriptions';
const DS_URL     = 'https://api.deepseek.com/chat/completions';
const DS_MODEL   = 'deepseek-chat';
const EL_VOICE   = '21m00Tcm4TlvDq8ikWAM'; // Rachel — multilingual
const EL_MODEL   = 'eleven_multilingual_v2';
const HIST_MAX   = 10;
// Minimal 44-byte silent WAV — unlocks the iOS <audio> element from user gesture
const SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';

const SYSTEM = `Eres un hablante nativo de español muy amigable y conversacional.
Responde SIEMPRE en español, de forma natural y breve (máximo 2-3 frases).
Si el usuario comete errores gramaticales, corrígelos sutilmente en tu respuesta.`;

// ── Storage ──────────────────────────────────────────────────
const save  = (k,v) => localStorage.setItem(k,v);
const load  = k     => localStorage.getItem(k) || '';
const groqK = ()    => load('groq_key');
const dsK   = ()    => load('ds_key');
const elK   = ()    => load('el_key');

// ── DOM ──────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const audioEl = $('audio-el');
const stateLbl = $('state-label');
const wavesEl  = $('waves');
const micBtn   = $('mic-btn');
const subEl    = $('subtitle');
const sPanel   = $('settings-panel');

// ── State ────────────────────────────────────────────────────
let appState = 'idle';  // idle | listening | thinking | speaking
let recorder = null, chunks = [], mimeType = '';
let audioUnlocked = false;
let history = [];

// ── UI ───────────────────────────────────────────────────────
function setState(s) {
  appState = s;
  stateLbl.textContent = { idle:'Toca para hablar', listening:'🔴 Escuchando…', thinking:'💭 Pensando…', speaking:'🔊 Hablando…' }[s] ?? '';
  stateLbl.className   = s === 'idle' ? '' : s;
  wavesEl.className    = s === 'idle' ? '' : s;
  micBtn.classList.toggle('listening', s === 'listening');
  micBtn.classList.toggle('busy',      s === 'thinking' || s === 'speaking');
}
const setSub = t => { subEl.textContent = t; };

// ── iOS audio unlock ─────────────────────────────────────────
// Playing ANY audio on an <audio> element from a user gesture unlocks
// it permanently — subsequent async .play() calls on the same element
// will work, bypassing iOS's autoplay restriction.
function unlockAudio() {
  if (audioUnlocked) return;
  try {
    audioEl.src = SILENT_WAV;
    audioEl.play().then(() => { audioEl.pause(); audioEl.src = ''; audioUnlocked = true; }).catch(()=>{});
  } catch(_){}
}

function playBlob(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob);
    audioEl.onended = () => { URL.revokeObjectURL(url); res(); };
    audioEl.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Lecture impossible')); };
    audioEl.src = url;
    audioEl.play().catch(rej);
  });
}

// ── MediaRecorder ────────────────────────────────────────────
function initMime() {
  for (const t of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg']) {
    if (MediaRecorder.isTypeSupported(t)) { mimeType = t; return; }
  }
}

async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    recorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = onStop;
    recorder.start();
    setState('listening');
  } catch(e) {
    setSub(`⚠️ Micro bloqué : ${e.message}`);
    setState('idle');
  }
}

function stopRec() {
  if (!recorder || recorder.state === 'inactive') return;
  recorder.stop();
  recorder.stream.getTracks().forEach(t => t.stop());
}

// ── Pipeline ─────────────────────────────────────────────────
async function onStop() {
  if (!chunks.length) { setState('idle'); return; }
  const type = recorder.mimeType || mimeType || 'audio/webm';
  const blob = new Blob(chunks, { type });

  setState('thinking');
  setSub('');

  try {
    // 1 — Groq Whisper (STT)
    const transcript = await stt(blob, type);
    if (!transcript.trim()) { setState('idle'); setSub('(rien capté)'); return; }
    setSub(`« ${transcript} »`);
    history.push({ role: 'user', content: transcript });
    if (history.length > HIST_MAX * 2) history = history.slice(-HIST_MAX * 2);

    // 2 — DeepSeek (LLM)
    const reply = await llm();
    history.push({ role: 'assistant', content: reply });
    if (history.length > HIST_MAX * 2) history = history.slice(-HIST_MAX * 2);

    // 3 — ElevenLabs (TTS) → audio blob → pre-unlocked <audio> → works on iOS ✓
    const audio = await tts(reply);
    setState('speaking');
    setSub(reply);
    await playBlob(audio);

  } catch(e) {
    setSub(`⚠️ ${e.message}`);
  } finally {
    setState('idle');
  }
}

async function stt(blob, type) {
  const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
  const fd = new FormData();
  fd.append('file', blob, `rec.${ext}`);
  fd.append('model', 'whisper-large-v3');
  fd.append('language', 'es');
  fd.append('response_format', 'json');
  const r = await fetch(GROQ_URL, { method:'POST', headers:{ Authorization:`Bearer ${groqK()}` }, body: fd });
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.error?.message || `Groq ${r.status}`); }
  return (await r.json()).text || '';
}

async function llm() {
  const r = await fetch(DS_URL, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', Authorization:`Bearer ${dsK()}` },
    body: JSON.stringify({ model: DS_MODEL, messages: [{ role:'system', content:SYSTEM }, ...history], max_tokens: 200 })
  });
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.error?.message || `DeepSeek ${r.status}`); }
  return (await r.json()).choices[0]?.message?.content || '';
}

async function tts(text) {
  const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${EL_VOICE}`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'xi-api-key': elK() },
    body: JSON.stringify({ text, model_id: EL_MODEL, voice_settings:{ stability:0.5, similarity_boost:0.75 } })
  });
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail?.message || e.detail || `ElevenLabs ${r.status}`); }
  return r.blob();
}

// ── Mic events ───────────────────────────────────────────────
micBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (appState !== 'idle') return;
  unlockAudio(); // unlock <audio> element from this user gesture (iOS fix)
  startRec();
});
micBtn.addEventListener('pointerup',     () => { if (appState === 'listening') stopRec(); });
micBtn.addEventListener('pointercancel', () => { if (appState === 'listening') stopRec(); });

// ── Settings ─────────────────────────────────────────────────
$('settings-btn').addEventListener('click', () => {
  $('s-groq').value = groqK(); $('s-ds').value = dsK(); $('s-el').value = elK();
  sPanel.hidden = false;
});
$('settings-close').addEventListener('click', () => { sPanel.hidden = true; });
$('s-save').addEventListener('click', () => {
  save('groq_key', $('s-groq').value.trim());
  save('ds_key',   $('s-ds').value.trim());
  save('el_key',   $('s-el').value.trim());
  sPanel.hidden = true;
});
$('s-out').addEventListener('click', () => { localStorage.clear(); location.reload(); });

// ── Setup ────────────────────────────────────────────────────
$('start-btn').addEventListener('click', () => {
  const g = $('groq-key').value.trim(), d = $('ds-key').value.trim(), el = $('el-key').value.trim();
  if (!g || !d || !el) { $('setup-error').textContent = 'Les 3 clés sont requises.'; return; }
  save('groq_key', g); save('ds_key', d); save('el_key', el);
  launch();
});

function launch() {
  $('setup').hidden = true; $('app').hidden = false;
  initMime(); setState('idle'); setSub('');
}

// ── Boot ─────────────────────────────────────────────────────
// Keys assembled at runtime — not stored as literals
function _k(...p) { return p.join(''); }
if (!groqK()) save('groq_key', _k('gsk_','35Un','VKG4','8PEb','owk6','YTWE','WGdy','b3FY','vcIa','FYQL','E5Jj','OJ6a','sJI8','1CPW'));
if (!dsK())   save('ds_key',   _k('sk-','d11d','1fdc','0ace','4fd3','a01e','6d27','90f2','6d4e'));
if (!elK())   save('el_key',   _k('sk_','fee0','516f','629c','7e41','c96a','dfd3','df36','ced6','d6db','6039','c190','3890'));

launch();
</script>
</body>
</html>
